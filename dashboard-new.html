<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X • Private Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#401500,transparent 45%),
    #050505;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 5%;
  background:#090909;
  border-bottom:1px solid #252525;
}

.logo{
  color:#ff6a00;
  font-size:25px;
  font-weight:900;
  text-shadow:0 0 15px #ff6a00;
}

.logout{
  padding:9px 16px;
  border:1px solid #ff6a00;
  border-radius:8px;
  background:transparent;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.logout:hover{
  background:#ff6a00;
}

main{
  width:92%;
  max-width:1000px;
  margin:35px auto;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
}

.welcome p{
  color:#888;
  margin-top:7px;
}

.upload{
  padding:25px;
  background:#111;
  border:1px solid #ff6a00;
  border-radius:18px;
  text-align:center;
  box-shadow:0 0 25px #ff6a0025;
}

.upload h2{
  margin-bottom:10px;
}

.upload p{
  color:#888;
  font-size:14px;
}

.file-input{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:1px dashed #ff6a00;
  border-radius:10px;
  background:#070707;
  color:#aaa;
}

.upload-btn{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(90deg,#ff3d00,#ff8500);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.upload-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#message{
  min-height:20px;
  margin-top:15px;
  color:#ff9b63;
  font-size:13px;
}

.files{
  margin-top:30px;
}

.files h2{
  margin-bottom:15px;
}

.search{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border:1px solid #333;
  border-radius:10px;
  background:#090909;
  color:#fff;
  outline:none;
}

.search:focus{
  border-color:#ff6a00;
}

.file-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:15px;
}

.file-card{
  overflow:hidden;
  background:#0d0d0d;
  border:1px solid #252525;
  border-radius:14px;
}

.preview{
  width:100%;
  height:180px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#070707;
  color:#777;
  overflow:hidden;
}

.preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.file-info{
  padding:14px;
}

.file-name{
  font-weight:bold;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.file-meta{
  margin-top:7px;
  color:#777;
  font-size:12px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.actions button{
  flex:1;
  padding:9px;
  border:1px solid #ff6a00;
  border-radius:7px;
  background:transparent;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.actions button:hover{
  background:#ff6a00;
}

.actions .delete{
  border-color:#ff3d00;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
  border:1px solid #222;
  border-radius:15px;
  background:#0d0d0d;
}

@media(max-width:600px){
  .file-grid{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">⚡ RISHI X</div>

  <button class="logout" onclick="logout()">
    Logout
  </button>
</header>

<main>

<section class="welcome">
  <h1>My Private Vault</h1>
  <p id="userEmail">Loading account...</p>
</section>

<section class="upload">

  <h2>📤 Upload File</h2>

  <p>
    Upload your private files securely.
  </p>

  <input
    class="file-input"
    type="file"
    id="file"
  >

  <button
    class="upload-btn"
    id="uploadButton"
    onclick="uploadFile()">
    UPLOAD FILE
  </button>

  <p id="message"></p>

</section>

<section class="files">

  <h2>🗂️ My Files</h2>

  <input
    class="search"
    id="search"
    type="text"
    placeholder="🔍 Search your files..."
    oninput="filterFiles()"
  >

  <div id="fileList" class="file-grid">
    <div class="empty">
      Loading files...
    </div>
  </div>

</section>

</main>

<script>

const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const BUCKET_NAME =
  "user-files";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentUser = null;
let allFiles = [];


function showMessage(text){
  document.getElementById("message").textContent = text;
}


async function checkLogin(){

  const {data,error} =
    await supabaseClient.auth.getSession();

  if(error || !data.session){
    window.location.href = "index.html";
    return;
  }

  currentUser = data.session.user;

  document.getElementById("userEmail")
    .textContent = currentUser.email;

  await loadFiles();
}


async function uploadFile(){

  const input =
    document.getElementById("file");

  const file = input.files[0];

  if(!file){
    showMessage("Please select a file first.");
    return;
  }

  if(!currentUser){
    showMessage("You are not logged in.");
    return;
  }

  const button =
    document.getElementById("uploadButton");

  button.disabled = true;
  button.textContent = "UPLOADING...";

  showMessage("Uploading file...");

  const safeName =
    file.name.replace(/[^a-zA-Z0-9._-]/g,"_");

  const filePath =
    currentUser.id +
    "/" +
    Date.now() +
    "_" +
    safeName;

  const {error} =
    await supabaseClient.storage
      .from(BUCKET_NAME)
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );

  button.disabled = false;
  button.textContent = "UPLOAD FILE";

  if(error){
    showMessage(
      "Upload failed: " + error.message
    );
    return;
  }

  input.value = "";

  showMessage(
    "✅ File uploaded successfully!"
  );

  await loadFiles();
}


async function loadFiles(){

  const fileList =
    document.getElementById("fileList");

  fileList.innerHTML =
    '<div class="empty">Loading files...</div>';

  const {data,error} =
    await supabaseClient.storage
      .from(BUCKET_NAME)
      .list(
        currentUser.id,
        {
          limit:100,
          offset:0,
          sortBy:{
            column:"created_at",
            order:"desc"
          }
        }
      );

  if(error){
    fileList.innerHTML =
      '<div class="empty">Unable to load files.</div>';
    return;
  }

  allFiles = data || [];

  renderFiles(allFiles);
}


function renderFiles(files){

  const fileList =
    document.getElementById("fileList");

  if(!files.length){
    fileList.innerHTML =
      '<div class="empty">No files found.</div>';
    return;
  }

  fileList.innerHTML = "";

  files.forEach(file => {

    const card =
      document.createElement("div");

    card.className = "file-card";

    const preview =
      document.createElement("div");

    preview.className = "preview";

    const extension =
      file.name.split(".").pop().toLowerCase();

    const imageTypes =
      ["jpg","jpeg","png","gif","webp"];

    if(imageTypes.includes(extension)){

      const img =
        document.createElement("img");

      createPreviewUrl(file.name)
        .then(url => {
          if(url){
            img.src = url;
          }else{
            preview.textContent = "🖼️";
          }
        });

      preview.appendChild(img);

    }else{

      preview.textContent = "📄";

    }

    const info =
      document.createElement("div");

    info.className = "file-info";

    const name =
      document.createElement("div");

    name.className = "file-name";

    name.textContent = file.name;

    const meta =
      document.createElement("div");

    meta.className = "file-meta";

    meta.textContent =
      "Uploaded: " +
      formatDate(file.created_at);

    const actions =
      document.createElement("div");

    actions.className = "actions";

    const openBtn =
      document.createElement("button");

    openBtn.textContent = "OPEN";

    openBtn.onclick =
      () => openFile(file.name);

    const deleteBtn =
      document.createElement("button");

    deleteBtn.textContent = "DELETE";
    deleteBtn.className = "delete";

    deleteBtn.onclick =
      () => deleteFile(file.name);

    actions.appendChild(openBtn);
    actions.appendChild(deleteBtn);

    info.appendChild(name);
    info.appendChild(meta);
    info.appendChild(actions);

    card.appendChild(preview);
    card.appendChild(info);

    fileList.appendChild(card);

  });
}


async function createPreviewUrl(fileName){

  const path =
    currentUser.id +
    "/" +
    fileName;

  const {data,error} =
    await supabaseClient.storage
      .from(BUCKET_NAME)
      .createSignedUrl(
        path,
        600
      );

  if(error){
    return null;
  }

  return data.signedUrl;
}


async function openFile(fileName){

  const path =
    currentUser.id +
    "/" +
    fileName;

  const {data,error} =
    await supabaseClient.storage
      .from(BUCKET_NAME)
      .createSignedUrl(
        path,
        600
      );

  if(error){
    showMessage(
      "Unable to open file: " +
      error.message
    );
    return;
  }

  window.open(
    data.signedUrl,
    "_blank"
  );
}


async function deleteFile(fileName){

  const confirmed =
    confirm(
      "Are you sure you want to delete this file?"
    );

  if(!confirmed){
    return;
  }

  const path =
    currentUser.id +
    "/" +
    fileName;

  const {error} =
    await supabaseClient.storage
      .from(BUCKET_NAME)
      .remove([path]);

  if(error){
    showMessage(
      "Delete failed: " +
      error.message
    );
    return;
  }

  showMessage(
    "✅ File deleted."
  );

  await loadFiles();
}


function filterFiles(){

  const query =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    allFiles.filter(file =>
      file.name.toLowerCase()
        .includes(query)
    );

  renderFiles(filtered);
}


function formatDate(date){

  if(!date){
    return "Unknown date";
  }

  return new Date(date)
    .toLocaleString();
}


async function logout(){

  const {error} =
    await supabaseClient.auth.signOut();

  if(error){

    showMessage(
      "Logout failed: " +
      error.message
    );

    return;
  }

  window.location.href =
    "index.html";
}


checkLogin();

</script>

</body>
</html>
