<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RECX • My Requests</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
      radial-gradient(circle at 15% 10%,rgba(255,70,0,.15),transparent 30%),
      radial-gradient(circle at 90% 80%,rgba(0,140,255,.12),transparent 30%),
      #050505;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 5%;
    background:rgba(5,5,5,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff4b00;
}

.back{
    padding:10px 15px;
    border-radius:12px;
    color:#fff;
    text-decoration:none;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
}

.container{
    width:min(1000px,92%);
    margin:30px auto;
}

.hero{
    padding:28px;
    border-radius:24px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
    backdrop-filter:blur(20px);
}

.hero h1{
    font-size:30px;
}

.hero p{
    margin-top:8px;
    color:#888;
}

.requests{
    display:grid;
    gap:16px;
    margin-top:22px;
}

.card{
    padding:22px;
    border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.product{
    font-size:20px;
    font-weight:800;
}

.meta{
    margin-top:8px;
    color:#999;
    line-height:1.6;
}

.status{
    height:max-content;
    padding:8px 12px;
    border-radius:999px;
    font-size:11px;
    font-weight:800;
    text-transform:uppercase;
}

.pending{
    color:#ffc107;
    background:rgba(255,193,7,.12);
}

.approved{
    color:#00dc78;
    background:rgba(0,220,120,.12);
}

.rejected{
    color:#ff5555;
    background:rgba(255,60,60,.12);
}

.info{
    margin-top:18px;
    padding:16px;
    border-radius:15px;
    background:#0b0b0b;
    border:1px solid #202020;
}

.info label{
    display:block;
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.key{
    margin-top:10px;
    padding:16px;
    border-radius:14px;
    background:rgba(0,220,120,.08);
    border:1px solid rgba(0,220,120,.25);
}

.key-title{
    color:#00dc78;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

.key-value{
    word-break:break-all;
    font-size:18px;
    font-weight:800;
}

.note{
    margin-top:10px;
    color:#aaa;
}

.empty,
.loading{
    padding:45px 20px;
    text-align:center;
    color:#777;
    border:1px dashed #292929;
    border-radius:20px;
}

.refresh{
    margin-top:18px;
    padding:11px 16px;
    border:1px solid #292929;
    border-radius:12px;
    background:#111;
    color:#fff;
    cursor:pointer;
}

@media(max-width:650px){

    .top{
        flex-direction:column;
    }

    .hero h1{
        font-size:25px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        REC<span>X</span>
    </div>

    <a class="back" href="dashboard-new.html">
        ← Store
    </a>

</header>

<main class="container">

<section class="hero">

    <h1>MY REQUESTS</h1>

    <p>
        Track your payment verification and delivered keys.
    </p>

    <button class="refresh" onclick="loadRequests()">
        ↻ Refresh
    </button>

</section>

<section id="requests" class="requests">

    <div class="loading">
        Loading your requests...
    </div>

</section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const {createClient} = supabase;

const db =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ==============================
   AUTH
============================== */

async function checkUser(){

    const {
        data:{session}
    } =
    await db.auth.getSession();

    if(!session){

        window.location.href =
            "index.html";

        return null;
    }

    return session.user;
}


/* ==============================
   LOAD REQUESTS
============================== */

async function loadRequests(){

    const user =
        await checkUser();

    if(!user) return;

    const container =
        document.getElementById("requests");

    container.innerHTML =
        `<div class="loading">
            Loading your requests...
        </div>`;

    const {
        data,
        error
    } =
    await db
        .from("mads_requests")
        .select(
            "id,product,plan,amount,status,admin_key,admin_note,created_at,updated_at"
        )
        .eq("user_id",user.id)
        .order(
            "created_at",
            {ascending:false}
        );

    if(error){

        container.innerHTML =
        `<div class="empty">
            Unable to load requests.<br><br>
            ${escapeHtml(error.message)}
        </div>`;

        return;
    }

    if(!data || !data.length){

        container.innerHTML =
        `<div class="empty">
            No payment requests yet.<br><br>
            Select a plan from the MADS Store to get started.
        </div>`;

        return;
    }

    container.innerHTML =
        data.map(renderRequest).join("");
}


/* ==============================
   REQUEST CARD
============================== */

function renderRequest(r){

    const date =
        new Date(r.created_at)
        .toLocaleString();

    let message = "";

    if(r.status === "pending"){

        message = `
            <div class="info">
                <label>Payment Status</label>
                Payment received for verification.
                Your request is currently pending.
                <br><br>
                Once verified, your key will appear here.
            </div>
        `;

    }

    if(r.status === "approved"){

        message = `
            <div class="key">

                <div class="key-title">
                    🔑 YOUR KEY
                </div>

                <div class="key-value">
                    ${escapeHtml(r.admin_key || "Key not added yet")}
                </div>

            </div>
        `;

    }

    if(r.status === "rejected"){

        message = `
            <div class="info">

                <label>Request Status</label>

                Payment request was rejected.

                ${
                    r.admin_note
                    ?
                    `<div class="note">
                        Note: ${escapeHtml(r.admin_note)}
                    </div>`
                    :
                    ""
                }

            </div>
        `;

    }

    return `
    <article class="card">

        <div class="top">

            <div>

                <div class="product">
                    ${escapeHtml(r.product)}
                </div>

                <div class="meta">

                    Plan:
                    ${escapeHtml(r.plan)}

                    <br>

                    Amount:
                    ₹${escapeHtml(r.amount)}

                    <br>

                    Submitted:
                    ${escapeHtml(date)}

                </div>

            </div>

            <span class="status ${escapeHtml(r.status)}">
                ${escapeHtml(r.status)}
            </span>

        </div>

        ${message}

    </article>
    `;
}


/* ==============================
   ESCAPE
============================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* ==============================
   AUTO REFRESH
============================== */

loadRequests();

setInterval(
    loadRequests,
    10000
);

</script>

</body>
</html>
