<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RECX • Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:
    Inter,
    Arial,
    sans-serif;

  color:#171717;

  background:
    radial-gradient(
      circle at 15% 15%,
      rgba(255,90,0,.18),
      transparent 30%
    ),
    radial-gradient(
      circle at 85% 20%,
      rgba(0,150,255,.12),
      transparent 28%
    ),
    linear-gradient(
      135deg,
      #fafcff,
      #edf1f6
    );

}

.container{

  width:100%;
  max-width:430px;

  perspective:1200px;

}

.card{

  padding:30px 25px;

  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.94),
      rgba(255,255,255,.68)
    );

  border:
    1px solid rgba(255,255,255,.95);

  box-shadow:

    0 30px 70px
    rgba(30,40,60,.16),

    0 8px 25px
    rgba(255,80,0,.06);

  backdrop-filter:blur(20px);

  transform-style:preserve-3d;

  transition:.18s ease-out;

}

.logo{

  text-align:center;

  font-size:31px;

  font-weight:950;

  letter-spacing:3px;

  background:
    linear-gradient(
      90deg,
      #ff3d00,
      #ff9200
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

}

.subtitle{

  text-align:center;

  color:#777;

  font-size:12px;

  font-weight:700;

  margin-top:7px;

  margin-bottom:25px;

}

.badge{

  width:max-content;

  margin:0 auto 18px;

  padding:7px 12px;

  border-radius:50px;

  background:
    rgba(255,90,0,.08);

  border:
    1px solid rgba(255,90,0,.16);

  color:#e64d00;

  font-size:10px;

  font-weight:900;

  letter-spacing:1px;

}

label{

  display:block;

  margin-bottom:8px;

  color:#555;

  font-size:12px;

  font-weight:800;

}

input{

  width:100%;

  height:52px;

  padding:0 15px;

  border-radius:14px;

  border:1px solid #dfe3e8;

  outline:none;

  background:rgba(255,255,255,.9);

  color:#111;

  font-size:14px;

  font-weight:600;

}

input:focus{

  border-color:#ff6a00;

  box-shadow:
    0 0 0 4px
    rgba(255,90,0,.09);

}

button{

  width:100%;

  height:53px;

  margin-top:16px;

  border:0;

  border-radius:15px;

  cursor:pointer;

  font-size:12px;

  font-weight:950;

  letter-spacing:1px;

  transition:.23s;

}

.login{

  color:white;

  background:
    linear-gradient(
      135deg,
      #ff3d00,
      #ff7900,
      #ff9a3d
    );

  box-shadow:
    0 12px 25px
    rgba(255,70,0,.23);

}

.login:hover{

  transform:translateY(-3px);

  box-shadow:
    0 17px 30px
    rgba(255,70,0,.29);

}

.back{

  color:#444;

  background:#f0f1f3;

  border:1px solid #e0e2e6;

}

.back:hover{

  transform:translateY(-2px);

}

button:disabled{

  opacity:.6;

  cursor:not-allowed;

  transform:none;

}

#message{

  min-height:20px;

  text-align:center;

  margin-top:16px;

  color:#e65a15;

  font-size:12px;

  font-weight:700;

}

.footer{

  text-align:center;

  margin-top:20px;

  color:#777;

  font-size:10px;

  font-weight:700;

}

</style>

</head>


<body>


<div class="container">


  <div class="card" id="card">


    <div class="logo">
      ⚡ RECX
    </div>


    <div class="subtitle">
      SECURE ADMIN CONTROL
    </div>


    <div class="badge">
      🔐 AUTHORIZED ACCESS ONLY
    </div>


    <label for="email">
      Admin Email
    </label>


    <input
      id="email"
      type="email"
      placeholder="Enter admin email"
      autocomplete="email"
    >


    <button
      class="login"
      id="loginButton"
      onclick="sendAdminLogin()">

      SEND ADMIN LOGIN LINK

    </button>


    <button
      class="back"
      onclick="goBack()">

      ← BACK TO WEBSITE

    </button>


    <p id="message"></p>


  </div>


  <div class="footer">

    Powered by Rishi X &amp; Shiva

  </div>


</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   ADMIN REDIRECT
========================= */

const ADMIN_REDIRECT_URL =
  "https://ranjanrishi315-a11y.github.io/rishi-x/admin.html";


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  document.getElementById(
    "message"
  ).textContent = text;

}


/* =========================
   SEND ADMIN LOGIN
========================= */

async function sendAdminLogin(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const button =
    document.getElementById(
      "loginButton"
    );


  if(!email){

    showMessage(
      "Please enter your admin email."
    );

    return;

  }


  button.disabled = true;

  button.textContent =
    "SENDING...";


  showMessage(
    "Sending secure admin login link..."
  );


  const {error} =
    await supabaseClient.auth
      .signInWithOtp({

        email:email,

        options:{
          emailRedirectTo:
            ADMIN_REDIRECT_URL
        }

      });


  if(error){

    button.disabled = false;

    button.textContent =
      "SEND ADMIN LOGIN LINK";

    showMessage(
      "Error: " +
      error.message
    );

    return;

  }


  button.textContent =
    "LINK SENT ✓";


  showMessage(
    "Admin login link sent. Check your email."
  );

}


/* =========================
   CHECK ADMIN SESSION
========================= */

async function checkAdminSession(){

  const {
    data,
    error
  } =
    await supabaseClient.auth
      .getSession();


  if(error){

    console.error(error);

    return;

  }


  if(!data.session){

    return;

  }


  showMessage(
    "Checking admin authorization..."
  );


  const {
    data:isAdmin,
    error:adminError
  } =
    await supabaseClient.rpc(
      "is_admin"
    );


  if(adminError){

    console.error(adminError);

    showMessage(
      "Admin verification failed."
    );

    return;

  }


  if(!isAdmin){

    await supabaseClient.auth.signOut();

    showMessage(
      "❌ This account is not authorized as admin."
    );

    return;

  }


  showMessage(
    "✅ Admin verified. Opening dashboard..."
  );


  setTimeout(function(){

    window.location.href =
      "admin-dashboard.html";

  },700);

}


/* =========================
   BACK
========================= */

function goBack(){

  window.location.href =
    "index.html";

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("email")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        sendAdminLogin();

      }

    }
  );


/* =========================
   START
========================= */

checkAdminSession();


/* =========================
   3D EFFECT
========================= */

const card =
  document.getElementById("card");


document.addEventListener(
  "mousemove",
  function(event){

    const rect =
      card.getBoundingClientRect();


    const centerX =
      rect.left +
      rect.width / 2;

    const centerY =
      rect.top +
      rect.height / 2;


    const rotateY =
      (event.clientX - centerX) /
      rect.width * 5;


    const rotateX =
      -(event.clientY - centerY) /
      rect.height * 5;


    card.style.transform =
      `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

  }
);


document.addEventListener(
  "mouseleave",
  function(){

    card.style.transform =
      "rotateX(0deg) rotateY(0deg)";

  }
);

</script>


</body>

</html>
