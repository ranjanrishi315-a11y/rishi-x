<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RECX • Admin Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(255,115,0,.10),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(255,50,0,.08),transparent 35%),
        #f5f7fb;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#111;
}

.card{
    width:100%;
    max-width:440px;
    background:rgba(255,255,255,.92);
    border:1px solid rgba(0,0,0,.08);
    border-radius:28px;
    padding:32px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.12),
        0 8px 25px rgba(255,90,0,.08);
    backdrop-filter:blur(20px);
}

.logo{
    width:68px;
    height:68px;
    margin:0 auto 18px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:27px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#ff5a00,#ff8a00);
    box-shadow:0 12px 30px rgba(255,90,0,.28);
}

h1{
    text-align:center;
    font-size:28px;
    margin-bottom:7px;
}

.subtitle{
    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:28px;
}

label{
    display:block;
    font-size:13px;
    font-weight:700;
    margin-bottom:8px;
}

input{
    width:100%;
    padding:15px 16px;
    border-radius:14px;
    border:1px solid #ddd;
    outline:none;
    font-size:15px;
    background:#fff;
    transition:.2s;
}

input:focus{
    border-color:#ff6500;
    box-shadow:0 0 0 4px rgba(255,101,0,.10);
}

button{
    width:100%;
    border:0;
    padding:15px;
    margin-top:16px;
    border-radius:14px;
    background:linear-gradient(135deg,#ff5400,#ff8500);
    color:white;
    font-size:15px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(255,85,0,.22);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#555;
    text-decoration:none;
    font-size:13px;
}

.status{
    margin-top:18px;
    padding:13px;
    border-radius:13px;
    display:none;
    font-size:13px;
    line-height:1.5;
}

.status.show{
    display:block;
}

.status.info{
    background:#fff4e9;
    color:#a94b00;
}

.status.success{
    background:#eafaf0;
    color:#16733c;
}

.status.error{
    background:#fff0f0;
    color:#b3261e;
}

.footer{
    text-align:center;
    margin-top:25px;
    font-size:11px;
    color:#999;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">RX</div>

    <h1>RECX Admin</h1>

    <div class="subtitle">
        Secure administrator access
    </div>

    <form id="loginForm">

        <label for="email">Admin Email</label>

        <input
            id="email"
            type="email"
            placeholder="Enter admin email"
            autocomplete="email"
            required
        >

        <button id="loginBtn" type="submit">
            Send Login Link
        </button>

    </form>

    <div id="status" class="status"></div>

    <a class="back"
       href="index.html">
       ← Back to RECX
    </a>

    <div class="footer">
        Powered by Rishi X & Shiva
    </div>

</div>

<script>
/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   ELEMENTS
========================= */

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const loginBtn = document.getElementById("loginBtn");
const statusBox = document.getElementById("status");


/* =========================
   STATUS
========================= */

function showStatus(message,type="info"){
    statusBox.textContent = message;
    statusBox.className = "status show " + type;
}


/* =========================
   ADMIN CHECK
========================= */

async function checkAdminAndRedirect(){

    try{

        const {
            data:{
                session
            },
            error:sessionError
        } = await db.auth.getSession();

        if(sessionError){
            console.error(sessionError);
            return false;
        }

        if(!session){
            return false;
        }

        showStatus(
            "Verifying administrator access...",
            "info"
        );

        const {
            data:isAdmin,
            error:adminError
        } = await db.rpc("is_admin");

        if(adminError){

            console.error(adminError);

            showStatus(
                "Admin verification failed. Please try again.",
                "error"
            );

            return false;
        }

        if(isAdmin === true){

            showStatus(
                "Admin verified. Opening dashboard...",
                "success"
            );

            setTimeout(()=>{
                window.location.replace(
                    "admin-dashboard.html"
                );
            },500);

            return true;
        }

        await db.auth.signOut();

        showStatus(
            "This account is not authorized as an admin.",
            "error"
        );

        return false;

    }catch(error){

        console.error(error);

        showStatus(
            "Something went wrong while checking admin access.",
            "error"
        );

        return false;
    }
}


/* =========================
   EMAIL LOGIN
========================= */

form.addEventListener("submit",async(e)=>{

    e.preventDefault();

    const email =
        emailInput.value.trim();

    if(!email){
        showStatus(
            "Please enter your admin email.",
            "error"
        );
        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Sending...";

    showStatus(
        "Sending secure login link...",
        "info"
    );

    try{

        const redirectUrl =
            window.location.origin +
            window.location.pathname;

        const {
            error
        } = await db.auth.signInWithOtp({

            email:email,

            options:{
                emailRedirectTo:redirectUrl,
                shouldCreateUser:false
            }

        });

        if(error){

            console.error(error);

            showStatus(
                error.message,
                "error"
            );

            loginBtn.disabled = false;
            loginBtn.textContent = "Send Login Link";

            return;
        }

        showStatus(
            "Login link sent. Open the newest link from your email.",
            "success"
        );

    }catch(error){

        console.error(error);

        showStatus(
            "Unable to send login link.",
            "error"
        );

    }finally{

        loginBtn.disabled = false;
        loginBtn.textContent = "Send Login Link";
    }

});


/* =========================
   AUTH STATE
========================= */

db.auth.onAuthStateChange(
    async(event,session)=>{

        console.log(
            "AUTH EVENT:",
            event
        );

        if(
            session &&
            (
                event === "SIGNED_IN" ||
                event === "INITIAL_SESSION"
            )
        ){

            await checkAdminAndRedirect();

        }

    }
);


/* =========================
   PAGE LOAD
========================= */

(async()=>{

    await checkAdminAndRedirect();

})();
</script>

</body>
</html>
