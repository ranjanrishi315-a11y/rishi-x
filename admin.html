<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X Admin</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#401500,transparent 45%),
    #050505;
}

.card{
  width:92%;
  max-width:420px;
  padding:30px;
  background:#111;
  border:1px solid #ff6a00;
  border-radius:20px;
  box-shadow:0 0 30px #ff6a0030;
}

.logo{
  text-align:center;
  color:#ff6a00;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:25px;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#050505;
  color:white;
  outline:none;
}

input:focus{
  border-color:#ff6a00;
}

button{
  width:100%;
  padding:14px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  color:white;
  font-weight:bold;
  background:linear-gradient(90deg,#ff3d00,#ff8500);
  cursor:pointer;
}

#message{
  text-align:center;
  margin-top:15px;
  color:#ff8a45;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">👑 RISHI X</div>

  <p class="subtitle">
    Secure Admin Panel
  </p>

  <label>Admin ID</label>

  <input
    id="adminId"
    type="text"
    placeholder="Enter admin ID"
    autocomplete="username"
  >

  <label>Password</label>

  <input
    id="password"
    type="password"
    placeholder="Enter password"
    autocomplete="current-password"
  >

  <button onclick="login()">
    ADMIN LOGIN
  </button>

  <p id="message"></p>

</div>

<script>

function login(){

  const id =
    document.getElementById("adminId").value.trim();

  const password =
    document.getElementById("password").value;

  if(!id || !password){

    document.getElementById("message").textContent =
      "Please enter both fields.";

    return;
  }

  /*
    IMPORTANT:
    Real admin authentication must happen
    on a secure backend.

    Do NOT put the real admin password
    inside this public GitHub file.
  */

  document.getElementById("message").textContent =
    "Backend authentication is not connected yet.";

}

</script>

</body>
</html>
