<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X • Admin Login</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#401500,transparent 45%),
    #050505;
}

.card{
  width:92%;
  max-width:420px;
  padding:30px;
  background:#111;
  border:1px solid #ff6a00;
  border-radius:20px;
  box-shadow:0 0 30px #ff6a0030;
}

.logo{
  text-align:center;
  color:#ff6a00;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
  text-shadow:0 0 15px #ff6a00;
}

.subtitle{
  text-align:center;
  color:#888;
  margin-bottom:25px;
}

label{
  display:block;
  color:#bbb;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #333;
  background:#050505;
  color:white;
  outline:none;
}

input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 10px #ff6a0025;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:10px;
  color:white;
  font-weight:bold;
  background:linear-gradient(90deg,#ff3d00,#ff8500);
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#message{
  min-height:20px;
  text-align:center;
  margin-top:15px;
  color:#ff8a45;
  font-size:13px;
}

.back{
  margin-top:12px;
  background:transparent;
  border:1px solid #333;
}

.back:hover{
  background:#181818;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    👑 RISHI X
  </div>

  <p class="subtitle">
    Secure Admin Access
  </p>

  <label for="adminId">
    Admin ID
  </label>

  <input
    id="adminId"
    type="text"
    placeholder="Enter Admin ID"
    autocomplete="off"
  >

  <button
    id="loginButton"
    onclick="login()">
    ADMIN LOGIN
  </button>

  <button
    class="back"
    onclick="goBack()">
    ← Back to Website
  </button>

  <p id="message"></p>

</div>


<script>

/* ================================
   ADMIN ID
================================ */

const ADMIN_ID =
  "f3ffeb51-70a6-4a44-99fb-f4ff1fa2aedf";


/* ================================
   LOGIN
================================ */

function login(){

  const input =
    document
      .getElementById("adminId")
      .value
      .trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("loginButton");


  if(!input){

    message.textContent =
      "Please enter Admin ID.";

    return;

  }


  if(input !== ADMIN_ID){

    message.textContent =
      "❌ Invalid Admin ID.";

    return;

  }


  button.disabled = true;
  button.textContent = "VERIFYING...";

  message.textContent =
    "✅ Admin ID verified.";


  setTimeout(function(){

    window.location.href =
      "admin-dashboard.html";

  },500);

}


/* ================================
   BACK
================================ */

function goBack(){

  window.location.href =
    "index.html";

}


/* ================================
   ENTER KEY
================================ */

document
  .getElementById("adminId")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){
        login();
      }

    }
  );

</script>

</body>
</html>
