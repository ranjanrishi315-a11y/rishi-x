<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RECX • Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    color:#172033;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(92,145,255,.16),
            transparent 32%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(142,103,255,.13),
            transparent 34%
        ),
        linear-gradient(
            135deg,
            #f9fbff 0%,
            #eef4fb 48%,
            #f8faff 100%
        );
}

/* BACKGROUND DECORATION */

.bg-shape{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    filter:blur(1px);
    opacity:.55;
}

.shape-one{
    width:260px;
    height:260px;
    top:-120px;
    left:-90px;

    background:
        radial-gradient(
            circle,
            rgba(115,157,255,.16),
            transparent 70%
        );
}

.shape-two{
    width:330px;
    height:330px;
    right:-130px;
    bottom:-130px;

    background:
        radial-gradient(
            circle,
            rgba(158,122,255,.14),
            transparent 70%
        );
}

/* THREE DOT MENU */

.menu-container{
    position:fixed;
    top:20px;
    right:20px;
    z-index:1000;
}

.menu-button{
    width:44px;
    height:44px;

    border:none;
    outline:none;

    border-radius:14px;

    background:rgba(255,255,255,.78);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    color:#344158;

    font-size:25px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(45,66,105,.12),
        inset 0 1px 0 rgba(255,255,255,.95);

    transition:.25s ease;
}

.menu-button:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 34px rgba(45,66,105,.18),
        inset 0 1px 0 rgba(255,255,255,.95);
}

.menu-dropdown{
    position:absolute;
    top:52px;
    right:0;

    width:175px;

    padding:7px;

    border-radius:16px;

    background:rgba(255,255,255,.94);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 20px 45px rgba(35,52,88,.16),
        inset 0 1px 0 rgba(255,255,255,1);

    opacity:0;
    visibility:hidden;

    transform:
        translateY(-8px)
        scale(.96);

    transition:.2s ease;
}

.menu-dropdown.active{
    opacity:1;
    visibility:visible;

    transform:
        translateY(0)
        scale(1);
}

.menu-dropdown a{
    display:block;

    padding:12px 13px;

    border-radius:11px;

    text-decoration:none;

    color:#27334a;

    font-size:13px;
    font-weight:750;

    transition:.2s ease;
}

.menu-dropdown a:hover{
    background:#edf3ff;
    color:#557fe2;
}

/* MAIN */

.main{
    width:100%;
    max-width:440px;

    padding:24px;

    text-align:center;

    position:relative;
    z-index:2;
}

/* RECX */

.recx{
    display:inline-block;

    font-size:64px;

    line-height:1;

    font-weight:950;

    letter-spacing:7px;

    color:#dbe5f5;

    position:relative;

    text-shadow:
        0 2px 0 #c4d0e1,
        0 4px 0 #b6c4d7,
        0 7px 13px rgba(67,87,124,.22),
        0 16px 30px rgba(76,111,183,.13);
}

.recx::after{
    content:"";

    position:absolute;

    left:9%;
    right:9%;

    bottom:-11px;

    height:5px;

    border-radius:100px;

    background:
        linear-gradient(
            90deg,
            #79a9ff,
            #9c8cff,
            #76d9ef
        );

    box-shadow:
        0 4px 16px rgba(92,132,230,.22);
}

.small-label{
    margin-top:25px;

    color:#8d98aa;

    font-size:10px;

    font-weight:800;

    letter-spacing:3px;
}

/* LOGIN CARD */

.login-card{
    width:100%;

    margin-top:28px;

    padding:30px 26px 27px;

    border-radius:28px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.96),
            rgba(240,245,252,.88)
        );

    border:1px solid rgba(255,255,255,.98);

    box-shadow:
        0 28px 65px rgba(47,68,108,.15),
        0 8px 20px rgba(47,68,108,.07),
        inset 0 1px 0 rgba(255,255,255,1);

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}

.login-card:hover{
    transform:
        translateY(-4px)
        perspective(1000px)
        rotateX(1deg);

    box-shadow:
        0 34px 75px rgba(47,68,108,.19),
        0 10px 25px rgba(47,68,108,.09),
        inset 0 1px 0 rgba(255,255,255,1);
}

/* CARD TEXT */

.welcome{
    font-size:22px;

    font-weight:850;

    color:#263249;

    margin-bottom:7px;
}

.description{
    font-size:13px;

    color:#8b96a8;

    margin-bottom:23px;
}

/* INPUT */

.email-input{
    width:100%;

    height:54px;

    border:none;
    outline:none;

    border-radius:15px;

    padding:
        0 16px;

    background:#f5f8fc;

    color:#1e293b;

    font-size:14px;

    box-shadow:
        inset 0 2px 8px rgba(38,58,94,.06),
        0 1px 0 rgba(255,255,255,.9);

    transition:.25s ease;
}

.email-input::placeholder{
    color:#a0a9b7;
}

.email-input:focus{
    background:#fff;

    box-shadow:
        0 0 0 3px rgba(91,132,226,.12),
        inset 0 2px 7px rgba(38,58,94,.04);
}

/* BUTTON */

.login-button{
    width:100%;

    height:54px;

    margin-top:15px;

    border:none;
    outline:none;

    border-radius:15px;

    cursor:pointer;

    color:#fff;

    font-size:13px;

    font-weight:850;

    letter-spacing:1.1px;

    background:
        linear-gradient(
            135deg,
            #648ff0,
            #7c73e7
        );

    box-shadow:
        0 11px 24px rgba(92,119,220,.26),
        inset 0 1px 0 rgba(255,255,255,.25);

    transition:.25s ease;
}

.login-button:hover{
    transform:translateY(-2px);

    box-shadow:
        0 15px 30px rgba(92,119,220,.34),
        inset 0 1px 0 rgba(255,255,255,.28);
}

.login-button:active{
    transform:translateY(1px);
}

.login-button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

/* MESSAGE */

.message{
    min-height:20px;

    margin-top:14px;

    font-size:12px;

    font-weight:700;
}

.success{
    color:#13a56a;
}

.error{
    color:#e15d6b;
}

/* SOCIAL ICONS */

.socials{
    display:flex;

    justify-content:center;
    align-items:center;

    gap:12px;

    margin-top:22px;
}

.social{
    width:43px;
    height:43px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    background:rgba(255,255,255,.82);

    box-shadow:
        0 8px 20px rgba(44,63,99,.10),
        inset 0 1px 0 rgba(255,255,255,.95);

    transition:.25s ease;
}

.social:hover{
    transform:
        translateY(-3px)
        scale(1.04);
}

.social svg{
    width:21px;
    height:21px;
}

.telegram{
    color:#229ED9;
}

.whatsapp{
    color:#20c96b;
}

.youtube{
    color:#ff3030;
}

/* FOOTER */

.footer{
    margin-top:18px;

    color:#9aa4b4;

    font-size:11px;

    font-weight:600;

    letter-spacing:.5px;
}

/* MOBILE */

@media(max-width:500px){

    .main{
        padding:20px;
    }

    .recx{
        font-size:52px;
        letter-spacing:5px;
    }

    .login-card{
        padding:27px 20px 24px;
        border-radius:24px;
    }

    .menu-container{
        top:15px;
        right:15px;
    }

    .menu-button{
        width:42px;
        height:42px;
    }
}

@media(max-height:650px){

    .recx{
        font-size:46px;
    }

    .small-label{
        margin-top:20px;
    }

    .login-card{
        margin-top:20px;
        padding:23px;
    }

    .socials{
        margin-top:15px;
    }

    .footer{
        margin-top:11px;
    }
}
</style>
</head>

<body>

<div class="bg-shape shape-one"></div>
<div class="bg-shape shape-two"></div>


<!-- THREE DOT ADMIN MENU -->

<div class="menu-container">

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Menu">
        ⋮
    </button>

    <div
        class="menu-dropdown"
        id="menuDropdown">

        <a href="admin.html">
            Admin Login
        </a>

    </div>

</div>


<!-- MAIN -->

<main class="main">

    <!-- RECX BRAND -->

    <h1 class="recx">
        RECX
    </h1>

    <div class="small-label">
        SECURE LOGIN
    </div>


    <!-- LOGIN CARD -->

    <section class="login-card">

        <div class="welcome">
            Welcome Back
        </div>

        <div class="description">

        </div>

        <input

            class="email-input"

        >

        <button
            class="login-button"
            id="loginButton"

        <!-- WhatsApp -->

        <a

                <path d="M20 3.9A10 10 0 0 0 3.7 16.1L2 22l6-1.6A10 10 0 1 0 20 3.9Zm-8 16.3a8.3 8.3 0 0 1-4.2-1.1l-.3-.2-3.5.9.9-3.4-.2-.3A8.3 8.3 0 1 1 12 20.2Zm4.6-6.2c-.3-.2-1.7-.8-1.9-.9-.3-.1-.5-.2-.7.2-.2.3-.7.9-.8 1.1-.2.2-.3.2-.6.1-1.6-.8-2.6-1.4-3.6-3.2-.3-.5.3-.5.8-1.6.1-.2 0-.4-.1-.6-.1-.2-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4-.3.3-1.1 1-1.1 2.4s1.1 2.8 1.2 3c.1.2 2.1 3.2 5.1 4.5 1.9.8 2.7.9 3.7.8.6-.1 1.7-.7 1.9-1.3.2-.6.2-1.2.1-1.3-.1-.1-.3-.2-.6-.3Z"/>

        <a

            <svg

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
    "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const REDIRECT_URL =
    "https://ranjanrishi315-a11y.github.io/rishi-x/";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================
   THREE DOT MENU
========================= */

const menuButton =
    document.getElementById("menuButton");

const menuDropdown =
    document.getElementById("menuDropdown");


menuButton.addEventListener(
    "click",
    function(event){

        event.stopPropagation();

        menuDropdown.classList.toggle(
            "active"
        );

    }
);


document.addEventListener(
    "click",
    function(event){

        if(
            !menuDropdown.contains(event.target) &&
            !menuButton.contains(event.target)
        ){

            menuDropdown.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   LOGIN LINK
========================= */

async function sendLoginLink(){

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const button =
        document.getElementById(
            "loginButton"
        );

    const message =
        document.getElementById(
            "message"
        );


    message.textContent = "";
    message.className = "message";


    if(!email){

        message.textContent =
            "Please enter your email.";

        message.classList.add(
            "error"
        );

        return;
    }


    if(!email.includes("@")){

        message.textContent =
            "Please enter a valid email.";

        message.classList.add(
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "SENDING...";


    const { error } =
        await supabaseClient.auth.signInWithOtp({

            email: email,

            options:{
                emailRedirectTo:
                    REDIRECT_URL,

                shouldCreateUser:
                    true
            }

        });


    if(error){

        message.textContent =
            error.message;

        message.classList.add(
            "error"
        );

        button.disabled = false;

        button.textContent =
            "SEND LOGIN LINK";

        return;
    }


    message.textContent =
        "Login link sent to your email.";

    message.classList.add(
        "success"
    );


    button.textContent =
        "LINK SENT ✓";


    setTimeout(
        function(){

            button.disabled = false;

            button.textContent =
                "SEND LOGIN LINK";

        },
        5000
    );

}


/* =========================
   ENTER KEY
========================= */

document
    .getElementById("email")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                sendLoginLink();

            }

        }
    );


/* =========================
   EXISTING SESSION
========================= */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();


    if(data.session){

        window.location.href =
            "dashboard-new.html";

    }

}


checkSession();

</script>

</body>
