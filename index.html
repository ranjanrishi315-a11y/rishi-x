<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RISHI X</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #401500, transparent 45%),
        #050505;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 92%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      color: #ff6a00;
      font-size: 38px;
      font-weight: 900;
      text-shadow: 0 0 20px #ff6a00;
    }

    .logo p {
      color: #888;
      margin-top: 5px;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .card {
      padding: 28px;
      background: rgba(15, 15, 15, 0.96);
      border: 1px solid #292929;
      border-radius: 20px;
      box-shadow: 0 0 35px rgba(255, 106, 0, 0.15);
    }

    .badge {
      text-align: center;
      color: #ff8a45;
      font-size: 11px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin: 15px 0 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #080808;
      color: white;
      outline: none;
      font-size: 14px;
    }

    input:focus {
      border-color: #ff6a00;
      box-shadow: 0 0 10px rgba(255, 106, 0, 0.15);
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #ff3d00, #ff8500);
    }

    button:hover {
      opacity: 0.9;
    }

    .admin {
      margin-top: 12px;
      background: transparent;
      border: 1px solid #ff6a00;
      color: #ff8a45;
    }

    #message {
      min-height: 20px;
      text-align: center;
      margin-top: 18px;
      color: #ff9b63;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      color: #555;
      font-size: 11px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>⚡ RISHI X</h1>
      <p>PRIVATE FILE SHARING</p>
    </div>

    <div class="card">

      <div class="badge">
        SECURE • PRIVATE • VERIFIED
      </div>

      <h2>Welcome Back</h2>

      <p class="subtitle">
        Login to your private vault
      </p>

      <label>Email Address</label>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <button onclick="sendOTP()">
        SEND OTP
      </button>

      <label>Verification Code</label>

      <input
        id="otp"
        type="text"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
        inputmode="numeric"
      >

      <button onclick="login()">
        VERIFY & LOGIN
      </button>

      <button
        class="admin"
        onclick="location.href='admin.html'">
        👑 ADMIN LOGIN
      </button>

      <p id="message"></p>

    </div>

    <div class="footer">
      © 2026 RISHI X • Secure File Sharing
    </div>

  </div>


  <script>

    /* =========================
       SUPABASE CONFIG
       ========================= */

    const SUPABASE_URL =
      "https://asdbxlnttlsuhhnqeywa.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    /* =========================
       MESSAGE
       ========================= */

    function showMessage(text) {
      document.getElementById("message").textContent = text;
    }


    /* =========================
       SEND OTP
       ========================= */

    async function sendOTP() {

      const email =
        document.getElementById("email").value.trim();

      if (!email) {
        showMessage("Please enter your email.");
        return;
      }

      showMessage("Sending verification code...");

      const { error } =
        await supabaseClient.auth.signInWithOtp({
          email: email
        });

      if (error) {

        showMessage(
          "Error: " + error.message
        );

        return;
      }

      showMessage(
        "Verification code sent! Check your email."
      );
    }


    /* =========================
       VERIFY OTP
       ========================= */

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const otp =
        document.getElementById("otp").value.trim();

      if (!email || !otp) {

        showMessage(
          "Enter email and verification code."
        );

        return;
      }

      showMessage("Verifying...");

      const { data, error } =
        await supabaseClient.auth.verifyOtp({

          email: email,

          token: otp,

          type: "email"

        });


      if (error) {

        showMessage(
          "Error: " + error.message
        );

        return;
      }


      if (data.session) {

        showMessage(
          "Login successful! Redirecting..."
        );

        setTimeout(function () {

          window.location.href =
            "dashboard.html";

        }, 800);

      } else {

        showMessage(
          "Verification completed, but session was not created."
        );

      }
    }

  </script>

</body>

</html>
