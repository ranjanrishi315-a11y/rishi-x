<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RECX • Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --cyan:#00eaff;
  --blue:#1677ff;
  --purple:#8b3dff;
  --bg:#02050b;
  --card:rgba(7,13,25,.82);
  --border:rgba(0,234,255,.25);
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 10%,rgba(0,234,255,.14),transparent 30%),
    radial-gradient(circle at 10% 90%,rgba(139,61,255,.13),transparent 30%),
    radial-gradient(circle at 90% 70%,rgba(22,119,255,.10),transparent 30%),
    #02050b;
}

/* FUTURISTIC BACKGROUND */

.grid{
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(0,234,255,.08) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,234,255,.08) 1px,transparent 1px);
  background-size:45px 45px;
  transform:perspective(500px) rotateX(55deg) scale(1.5);
  transform-origin:center bottom;
}

.orb{
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  border:1px solid rgba(0,234,255,.12);
  box-shadow:
    0 0 80px rgba(0,234,255,.08),
    inset 0 0 60px rgba(0,234,255,.04);
  animation:float 7s ease-in-out infinite;
}

.orb.one{
  top:-120px;
  left:-100px;
}

.orb.two{
  right:-130px;
  bottom:-130px;
  animation-delay:2s;
}

@keyframes float{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-18px) scale(1.04);}
}

/* MAIN */

.container{
  position:relative;
  width:100%;
  max-width:430px;
  z-index:2;
}

/* LOGO */

.logo{
  text-align:center;
  margin-bottom:24px;
}

.logo h1{
  font-size:48px;
  font-weight:950;
  letter-spacing:7px;
  color:#fff;
  text-shadow:
    0 0 8px rgba(0,234,255,.8),
    0 0 25px rgba(0,234,255,.45);
}

.logo h1 span{
  color:var(--cyan);
}

.logo-line{
  width:110px;
  height:2px;
  margin:9px auto 0;
  background:linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    transparent
  );
  box-shadow:0 0 12px var(--cyan);
}

/* CARD */

.card{
  position:relative;
  padding:32px 28px 27px;
  border-radius:24px;
  background:var(--card);
  border:1px solid var(--border);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    0 25px 70px rgba(0,0,0,.65),
    0 0 35px rgba(0,234,255,.08);
  overflow:hidden;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:12%;
  right:12%;
  height:1px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    var(--purple),
    transparent
  );
  box-shadow:0 0 15px var(--cyan);
}

.card::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-100px;
  top:-100px;
  border-radius:50%;
  border:1px solid rgba(0,234,255,.12);
}

/* STATUS */

.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  color:#8ca0b9;
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:24px;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#00ff9d;
  box-shadow:0 0 12px #00ff9d;
}

/* HEADING */

.card h2{
  text-align:center;
  font-size:25px;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#718198;
  font-size:13px;
  margin-bottom:26px;
}

/* INPUT */

.field{
  position:relative;
  margin-top:18px;
}

.field label{
  display:block;
  color:#8ea0b8;
  font-size:11px;
  letter-spacing:1px;
  margin-bottom:8px;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:var(--cyan);
  font-size:15px;
}

input{
  width:100%;
  padding:14px 14px 14px 43px;
  border-radius:12px;
  border:1px solid #1c2b40;
  background:rgba(1,6,14,.9);
  color:#fff;
  outline:none;
  font-size:14px;
  transition:.25s;
}

input::placeholder{
  color:#536276;
}

input:focus{
  border-color:var(--cyan);
  box-shadow:
    0 0 0 3px rgba(0,234,255,.06),
    0 0 18px rgba(0,234,255,.12);
}

/* LOGIN BUTTON */

.login-btn{
  position:relative;
  width:100%;
  margin-top:23px;
  padding:15px;
  border:1px solid rgba(0,234,255,.5);
  border-radius:12px;
  color:#fff;
  font-weight:800;
  letter-spacing:1px;
  cursor:pointer;
  background:linear-gradient(
    100deg,
    #075dff,
    #1677ff,
    #7437ff
  );
  box-shadow:
    0 0 22px rgba(22,119,255,.25);
  transition:.25s;
  overflow:hidden;
}

.login-btn::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:60%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.25),
    transparent
  );
  transform:skewX(-20deg);
  transition:.6s;
}

.login-btn:hover::before{
  left:130%;
}

.login-btn:hover{
  transform:translateY(-2px);
  box-shadow:
    0 0 30px rgba(22,119,255,.4);
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* ADMIN */

.admin-btn{
  width:100%;
  margin-top:12px;
  padding:13px;
  border-radius:12px;
  border:1px solid #27374e;
  background:rgba(5,11,21,.8);
  color:#b8c7da;
  cursor:pointer;
  font-weight:700;
  transition:.25s;
}

.admin-btn:hover{
  border-color:#8b3dff;
  color:#fff;
  box-shadow:0 0 18px rgba(139,61,255,.15);
}

/* MESSAGE */

#message{
  min-height:20px;
  text-align:center;
  margin-top:17px;
  color:#00eaff;
  font-size:12px;
}

/* SECURITY */

.security{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:22px;
  color:#53647a;
  font-size:9px;
  letter-spacing:.8px;
}

.security span{
  display:flex;
  align-items:center;
  gap:5px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#3e4d60;
  font-size:10px;
  margin-top:18px;
  letter-spacing:.5px;
}

/* MOBILE */

@media(max-width:480px){

  body{
    padding:15px;
  }

  .logo h1{
    font-size:40px;
    letter-spacing:6px;
  }

  .card{
    padding:28px 21px 24px;
  }

  .security{
    gap:10px;
    font-size:8px;
  }
}
</style></head><body><div class="grid"></div>
<div class="orb one"></div>
<div class="orb two"></div><div class="container">  <div class="logo">
    <h1>RE<span>C</span>X</h1>
    <div class="logo-line"></div>
  </div>  <div class="card"><div class="status">
  <span class="status-dot"></span>
  SECURE SYSTEM ONLINE
</div>

<h2>Welcome Back</h2>

<p class="subtitle">
  Enter your email to access your account
</p>

<div class="field">

  <label>EMAIL ADDRESS</label>

  <div class="input-wrap">

    <span class="input-icon">✉</span>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

  </div>

</div>

<button
  class="login-btn"
  id="loginButton"
  onclick="sendOTP()"
>
  SEND LOGIN LINK
</button>

<button
  class="admin-btn"
  onclick="location.href='admin.html'"
>
  ⚡ ADMIN ACCESS
</button>

<p id="message"></p>

<div class="security">
  <span>🔒 SECURE</span>
  <span>⚡ FAST</span>
  <span>✓ VERIFIED</span>
</div>

  </div>  <div class="footer">
    © 2026 RECX • Secure Access System
  </div></div><script>

/* =========================
   SUPABASE CONFIGURATION
   SAME SYSTEM
========================= */

const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const REDIRECT_URL =
  "https://ranjanrishi315-a11y.github.io/rishi-x/";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================
   MESSAGE
========================= */

function showMessage(text){

  document.getElementById(
    "message"
  ).textContent = text;

}


/* =========================
   SEND LOGIN LINK
   SAME FUNCTION
========================= */

async function sendOTP(){

  const email =
    document.getElementById(
      "email"
    ).value.trim();

  const button =
    document.getElementById(
      "loginButton"
    );


  if(!email){

    showMessage(
      "Please enter your email."
    );

    return;
  }


  button.disabled = true;

  button.textContent =
    "AUTHENTICATING...";

  showMessage(
    "Sending secure login link..."
  );


  const { error } =
    await supabaseClient.auth
      .signInWithOtp({

        email:email,

        options:{
          emailRedirectTo:
            REDIRECT_URL
        }

      });


  button.disabled = false;

  button.textContent =
    "SEND LOGIN LINK";


  if(error){

    showMessage(
      "Error: " +
      error.message
    );

    return;
  }


  showMessage(
    "✓ Login link sent. Check your email."
  );

}


/* =========================
   CHECK LOGIN SESSION
   SAME FUNCTION
========================= */

async function checkSession(){

  const { data } =
    await supabaseClient.auth
      .getSession();


  if(data.session){

    window.location.href =
      "dashboard-new.html";

  }

}


/* =========================
   ENTER KEY
========================= */

document
  .getElementById("email")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        sendOTP();

      }

    }
  );


/* =========================
   START
========================= */

checkSession();

</script></body>
</html>
