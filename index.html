<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 15% 20%,rgba(100,143,240,.20),transparent 30%),
        radial-gradient(circle at 85% 80%,rgba(170,120,255,.18),transparent 30%),
        linear-gradient(135deg,#f8fbff,#eef3fa);
    color:#172033;
}

/* BACKGROUND */

.bg-shape{
    position:fixed;
    border-radius:50%;
    filter:blur(2px);
    pointer-events:none;
}

.shape1{
    width:280px;
    height:280px;
    top:-100px;
    left:-100px;
    background:rgba(100,143,240,.08);
}

.shape2{
    width:350px;
    height:350px;
    right:-150px;
    bottom:-150px;
    background:rgba(135,90,255,.08);
}

/* ADMIN MENU */

.menu{
    position:fixed;
    top:22px;
    right:22px;
    z-index:20;
}

.menu-btn{
    width:44px;
    height:44px;
    border:none;
    border-radius:14px;
    background:rgba(255,255,255,.75);
    box-shadow:
        0 8px 20px rgba(35,50,80,.12),
        inset 0 1px 0 rgba(255,255,255,.9);
    cursor:pointer;
    font-size:25px;
    color:#26344d;
}

.menu-content{
    display:none;
    position:absolute;
    right:0;
    top:52px;
    width:160px;
    padding:8px;
    border-radius:16px;
    background:rgba(255,255,255,.96);
    box-shadow:0 15px 35px rgba(30,40,70,.18);
}

.menu-content a{
    display:block;
    text-decoration:none;
    color:#182238;
    padding:12px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
}

.menu-content a:hover{
    background:#edf3ff;
}

.menu:hover .menu-content{
    display:block;
}

/* MAIN */

.main{
    width:100%;
    max-width:470px;
    padding:25px;
    text-align:center;
    position:relative;
    z-index:2;
}

/* RECX */

.logo{
    font-size:72px;
    font-weight:1000;
    letter-spacing:8px;
    margin-bottom:5px;

    color:#ffffff;

    text-shadow:
        0 2px 0 #c5d0e0,
        0 4px 0 #aab7cb,
        0 7px 0 #8e9db5,
        0 12px 18px rgba(30,45,75,.28);
}

.subtitle{
    font-size:11px;
    font-weight:800;
    letter-spacing:4px;
    color:#73809a;
    margin-bottom:30px;
}

/* CARD */

.login-card{
    background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.95);
    border-radius:28px;

    padding:35px 30px;

    box-shadow:
        0 25px 60px rgba(50,70,110,.16),
        0 8px 18px rgba(50,70,110,.08),
        inset 0 1px 0 rgba(255,255,255,.95);

    transform:perspective(900px) rotateX(1deg);
}

.title{
    font-size:27px;
    font-weight:900;
    margin-bottom:8px;
    color:#182238;
}

.desc{
    color:#7b879d;
    font-size:14px;
    margin-bottom:25px;
}

/* INPUT */

.input-box{
    position:relative;
    margin-bottom:16px;
}

input{
    width:100%;
    height:55px;
    border:1px solid #dce3ee;
    border-radius:15px;
    outline:none;
    padding:0 17px;
    font-size:15px;
    color:#182238;
    background:rgba(248,250,253,.9);
    transition:.25s;
}

input:focus{
    border-color:#648ff0;
    box-shadow:0 0 0 4px rgba(100,143,240,.10);
}

/* BUTTON */

.login-btn{
    width:100%;
    height:55px;
    border:0;
    border-radius:15px;

    background:linear-gradient(135deg,#648ff0,#5276d8);

    color:white;
    font-size:14px;
    font-weight:900;
    letter-spacing:1px;

    cursor:pointer;

    box-shadow:
        0 10px 22px rgba(82,118,216,.28),
        inset 0 1px 0 rgba(255,255,255,.25);

    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 14px 28px rgba(82,118,216,.35);
}

.login-btn:active{
    transform:translateY(1px);
}

#msg{
    min-height:20px;
    margin-top:15px;
    font-size:13px;
    font-weight:700;
    color:#64708a;
}

/* SOCIAL */

.social{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-top:25px;
}

.social a{
    width:47px;
    height:47px;
    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:14px;
    text-decoration:none;

    background:white;
    box-shadow:
        0 8px 18px rgba(40,55,85,.12);

    transition:.25s;
}

.social a:hover{
    transform:translateY(-3px);
}

.social svg{
    width:23px;
    height:23px;
}

/* FOOTER */

.footer{
    margin-top:22px;
    font-size:12px;
    color:#8a95a8;
    font-weight:700;
}

/* MOBILE */

@media(max-width:480px){

    .main{
        padding:20px;
    }

    .logo{
        font-size:58px;
        letter-spacing:6px;
    }

    .login-card{
        padding:30px 22px;
    }

    .title{
        font-size:24px;
    }

}

</style>
</head>

<body>

<div class="bg-shape shape1"></div>

<main class="main">

<script>

/* SUPABASE */

const SUPABASE_URL =
    "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const REDIRECT_URL =
    window.location.origin +
    "/rishi-x/dashboard-new.html";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* LOGIN */

async function sendLogin(){

    const email =
        document.getElementById("email").value.trim();

    const msg =
        document.getElementById("msg");

    const btn =
        document.getElementById("loginBtn");

    if(!email){

        msg.textContent =
            "Please enter your email.";

        return;
    }

    btn.disabled = true;

    btn.textContent =
        "SENDING...";

    msg.textContent =
        "";

    try{

        const { error } =
            await supabaseClient.auth.signInWithOtp({

                email:email,

                options:{
                    emailRedirectTo:REDIRECT_URL
                }

            });

        if(error){

            msg.textContent =
                error.message;

            btn.disabled = false;

            btn.textContent =
                "SEND LOGIN LINK";

            return;
        }

        msg.textContent =
            "Login link sent. Check your email.";

        btn.textContent =
            "LINK SENT";

    }

    catch(error){

        msg.textContent =
            "Something went wrong.";

        btn.disabled = false;

        btn.textContent =
            "SEND LOGIN LINK";

    }

}


/* SESSION CHECK */

async function checkSession(){

    const { data } =
        await supabaseClient.auth.getSession();

    if(
        data &&
        data.session &&
        window.location.pathname.endsWith("index.html")
    ){

        window.location.href =
            "dashboard-new.html";

    }

}


/* SERVICE WORKER / PWA */

if("serviceWorker" in navigator){

    window.addEventListener("load",()=>{

        navigator.serviceWorker
            .register("./sw.js")
            .then(()=>{
                console.log(
                    "RECX Service Worker registered."
                );
            })
            .catch(error=>{

                console.log(
                    "Service Worker Error:",
                    error
                );

            });

    });

}


/* RUN */

checkSession();

</script>
