<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X • Private Vault</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  min-height:100%;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px 15px;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 50% -10%,#5a2000 0%,transparent 38%),
    radial-gradient(circle at 0% 100%,#1b0800 0%,transparent 35%),
    #050505;
  overflow-x:hidden;
}

/* Background glow */

body::before{
  content:"";
  position:fixed;
  width:280px;
  height:280px;
  border-radius:50%;
  background:#ff6a00;
  filter:blur(140px);
  opacity:.08;
  top:-100px;
  right:-100px;
  pointer-events:none;
}

/* Main */

.container{
  width:100%;
  max-width:440px;
  position:relative;
  z-index:1;
}

/* Logo */

.logo{
  text-align:center;
  margin-bottom:22px;
}

.logo-icon{
  width:58px;
  height:58px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:18px;
  background:linear-gradient(145deg,#ff8500,#ff3d00);
  box-shadow:
    0 0 25px rgba(255,106,0,.35),
    inset 0 1px rgba(255,255,255,.2);
  font-size:27px;
}

.logo h1{
  color:#ff6a00;
  font-size:36px;
  font-weight:900;
  letter-spacing:1px;
  text-shadow:0 0 20px rgba(255,106,0,.65);
}

.logo p{
  color:#777;
  margin-top:6px;
  font-size:10px;
  letter-spacing:3px;
}

/* Card */

.card{
  padding:30px 26px 26px;
  background:rgba(15,15,15,.94);
  border:1px solid rgba(255,106,0,.28);
  border-radius:24px;
  box-shadow:
    0 25px 70px rgba(0,0,0,.55),
    0 0 35px rgba(255,106,0,.10);
  backdrop-filter:blur(12px);
}

/* Badge */

.badge{
  width:max-content;
  max-width:100%;
  margin:0 auto 20px;
  padding:7px 12px;
  border:1px solid rgba(255,106,0,.25);
  border-radius:50px;
  color:#ff9b63;
  background:rgba(255,106,0,.06);
  font-size:9px;
  letter-spacing:1.5px;
}

/* Heading */

h2{
  text-align:center;
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:27px;
  font-size:13px;
}

/* Labels */

label{
  display:block;
  color:#aaa;
  font-size:12px;
  margin:15px 0 8px;
}

/* Input */

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:14px;
  top:50%;
  transform:translateY(-50%);
  color:#777;
  font-size:15px;
  pointer-events:none;
}

input{
  width:100%;
  padding:14px 14px 14px 42px;
  border-radius:12px;
  border:1px solid #303030;
  background:#080808;
  color:#fff;
  outline:none;
  font-size:14px;
  transition:.2s;
}

input::placeholder{
  color:#555;
}

input:focus{
  border-color:#ff6a00;
  box-shadow:0 0 0 3px rgba(255,106,0,.08);
}

/* Main button */

.login-btn{
  position:relative;
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:12px;
  color:#fff;
  font-weight:800;
  font-size:14px;
  letter-spacing:.3px;
  cursor:pointer;
  background:linear-gradient(100deg,#ff3d00,#ff8500);
  box-shadow:0 8px 22px rgba(255,76,0,.18);
  transition:.2s;
}

.login-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 10px 28px rgba(255,76,0,.28);
}

.login-btn:active{
  transform:translateY(0);
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  transform:none;
}

/* Admin */

.admin{
  width:100%;
  padding:13px;
  margin-top:11px;
  border-radius:12px;
  border:1px solid rgba(255,106,0,.45);
  background:transparent;
  color:#ff9b63;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.admin:hover{
  background:rgba(255,106,0,.08);
  border-color:#ff6a00;
}

/* Message */

#message{
  min-height:20px;
  text-align:center;
  margin-top:17px;
  color:#ff9b63;
  font-size:12px;
  line-height:1.5;
}

/* Divider */

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0 4px;
  color:#444;
  font-size:10px;
}

.divider::before,
.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:#242424;
}

/* Security note */

.security{
  text-align:center;
  margin-top:18px;
  color:#555;
  font-size:10px;
  line-height:1.5;
}

/* Footer */

.footer{
  text-align:center;
  color:#4f4f4f;
  font-size:10px;
  margin-top:18px;
  letter-spacing:.2px;
}

/* Mobile */

@media(max-width:480px){

  body{
    padding:18px 12px;
  }

  .logo{
    margin-bottom:18px;
  }

  .logo-icon{
    width:52px;
    height:52px;
    border-radius:16px;
  }

  .logo h1{
    font-size:32px;
  }

  .card{
    padding:25px 20px 22px;
    border-radius:20px;
  }

  h2{
    font-size:23px;
  }
}

/* Small phones */

@media(max-width:350px){

  .logo h1{
    font-size:28px;
  }

  .card{
    padding:22px 16px;
  }

  input,
  .login-btn,
  .admin{
    font-size:13px;
  }
}
</style>
</head>


<body>

<div class="container">

  <!-- LOGO -->

  <div class="logo">

    <div class="logo-icon">
      ⚡
    </div>

    <h1>RISHI X</h1>

    <p>
      PRIVATE FILE SHARING
    </p>

  </div>


  <!-- LOGIN CARD -->

  <div class="card">

    <div class="badge">
      🔒 SECURE • PRIVATE • VERIFIED
    </div>


    <h2>
      Welcome Back
    </h2>

    <p class="subtitle">
      Login to your private vault
    </p>


    <!-- EMAIL -->

    <label for="email">
      Email Address
    </label>

    <div class="input-wrap">

      <span class="input-icon">
        ✉
      </span>

      <input
        id="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

    </div>


    <!-- LOGIN -->

    <button
      id="loginButton"
      class="login-btn"
      onclick="sendOTP()">

      SEND LOGIN LINK

    </button>


    <div class="divider">
      OR
    </div>


    <!-- ADMIN -->

    <button
      class="admin"
      onclick="openAdmin()">

      👑 ADMIN LOGIN

    </button>


    <p id="message"></p>


    <p class="security">
      Your files are protected using secure authentication.
    </p>

  </div>


  <!-- FOOTER -->

  <div class="footer">
    © 2026 RISHI X • Secure File Sharing
  </div>

</div>


<script>

/* =================================
   SUPABASE CONFIGURATION
================================= */

const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const REDIRECT_URL =
  "https://ranjanrishi315-a11y.github.io/rishi-x/";


/* =================================
   SUPABASE CLIENT
================================= */

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =================================
   MESSAGE
================================= */

function showMessage(text){

  document
    .getElementById("message")
    .textContent = text;

}


/* =================================
   SEND LOGIN LINK
================================= */

async function sendOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const button =
    document
      .getElementById("loginButton");


  /* Empty email */

  if(!email){

    showMessage(
      "Please enter your email."
    );

    return;

  }


  /* Basic email check */

  if(!email.includes("@")){

    showMessage(
      "Please enter a valid email."
    );

    return;

  }


  /* Loading */

  button.disabled = true;

  button.textContent =
    "SENDING...";

  showMessage(
    "Sending login link..."
  );


  try{

    const {error} =
      await supabaseClient.auth
        .signInWithOtp({

          email:email,

          options:{
            emailRedirectTo:
              REDIRECT_URL
          }

        });


    if(error){

      showMessage(
        "Error: " +
        error.message
      );

      button.disabled = false;

      button.textContent =
        "SEND LOGIN LINK";

      return;

    }


    button.textContent =
      "LINK SENT ✓";

    showMessage(
      "Login link sent! Check your email."
    );


    /* Allow another attempt */

    setTimeout(function(){

      button.disabled = false;

      button.textContent =
        "SEND LOGIN LINK";

    },5000);


  }catch(error){

    showMessage(
      "Something went wrong. Please try again."
    );

    button.disabled = false;

    button.textContent =
      "SEND LOGIN LINK";

  }

}


/* =================================
   OPEN ADMIN
================================= */

function openAdmin(){

  window.location.href =
    "admin.html";

}


/* =================================
   CHECK LOGIN SESSION
================================= */

async function checkSession(){

  try{

    const {data,error} =
      await supabaseClient.auth
        .getSession();


    if(error){

      console.log(
        "Session check error:",
        error.message
      );

      return;

    }


    if(data.session){

      window.location.href =
        "dashboard-new.html";

    }

  }catch(error){

    console.log(
      "Unable to check session."
    );

  }

}


/* =================================
   ENTER KEY
================================= */

document
  .getElementById("email")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        sendOTP();

      }

    }
  );


/* =================================
   START
================================= */

checkSession();

</script>

</body>
</html>
