<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RECX • Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
  display:flex;
  align-items:center;
  justify-content:center;
}

.container{
  width:100%;
  max-width:420px;
  padding:20px;
}

.menu{
  position:fixed;
  top:18px;
  right:18px;
}

.dots{
  width:38px;
  height:38px;
  border:1px solid #ddd;
  border-radius:10px;
  background:white;
  font-size:24px;
  cursor:pointer;
}

.dropdown{
  display:none;
  position:absolute;
  right:0;
  top:45px;
  width:150px;
  background:white;
  border:1px solid #ddd;
  border-radius:10px;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  overflow:hidden;
}

.dropdown.show{
  display:block;
}

.dropdown a{
  display:block;
  padding:12px;
  text-decoration:none;
  color:#111;
  font-size:14px;
}

.dropdown a:hover{
  background:#f1f5f9;
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
  color:#111827;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:28px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:28px;
  box-shadow:0 10px 35px rgba(0,0,0,.07);
}

.card h2{
  text-align:center;
  margin-bottom:8px;
}

.card p{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

input{
  width:100%;
  height:50px;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:0 14px;
  font-size:14px;
  outline:none;
}

input:focus{
  border-color:#2563eb;
}

button.login{
  width:100%;
  height:50px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button.login:disabled{
  opacity:.6;
}

#message{
  text-align:center;
  margin-top:15px;
  font-size:13px;
  color:#2563eb;
  min-height:18px;
}

.social{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.social a{
  flex:1;
  text-align:center;
  text-decoration:none;
  color:white;
  padding:11px 5px;
  border-radius:9px;
  font-size:11px;
  font-weight:bold;
}

.telegram{
  background:#229ed9;
}

.whatsapp{
  background:#25d366;
}

.youtube{
  background:#ff0000;
}

footer{
  text-align:center;
  margin-top:22px;
  color:#777;
  font-size:11px;
}
</style>
</head>

<body>

<div class="menu">
  <button class="dots" onclick="toggleMenu()">⋮</button>

  <div class="dropdown" id="dropdown">
    <a href="admin.html">👑 Admin Login</a>
  </div>
</div>

<div class="container">

  <div class="logo">⚡ RECX</div>

  <div class="subtitle">
    Secure • Private • Verified
  </div>

  <div class="card">

    <h2>Welcome Back</h2>

    <p>Login with your email</p>

    <label>Email Address</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <button
      class="login"
      id="loginButton"
      onclick="sendOTP()">
      SEND LOGIN LINK
    </button>

    <div id="message"></div>

  </div>

  <div class="social">

    <a
      class="telegram"
      href="https://t.me/panalstoreff"
      target="_blank">
      Telegram
    </a>

    <a
      class="whatsapp"
      href="https://whatsapp.com/channel/0029VbDyKyj0VycFxIRkAf2p"
      target="_blank">
      WhatsApp
    </a>

    <a
      class="youtube"
      href="https://youtube.com/@recxpanal-te6os?si=wEXVJ6vGkDRTCCRt"
      target="_blank">
      YouTube
    </a>

  </div>

  <footer>
    Powered by Rishi X & Shiva
  </footer>

</div>

<script>

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const REDIRECT_URL =
"https://ranjanrishi315-a11y.github.io/rishi-x/";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function sendOTP(){

  const email =
    document.getElementById("email").value.trim();

  const button =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  if(!email){
    message.textContent="Enter your email.";
    return;
  }

  button.disabled=true;
  button.textContent="SENDING...";
  message.textContent="";

  const {error} =
    await supabaseClient.auth.signInWithOtp({
      email:email,
      options:{
        emailRedirectTo:REDIRECT_URL
      }
    });

  if(error){

    button.disabled=false;
    button.textContent="SEND LOGIN LINK";
    message.textContent=error.message;
    return;

  }

  button.textContent="LINK SENT ✓";
  message.textContent=
    "Check your email for the login link.";

}

async function checkSession(){

  const {data} =
    await supabaseClient.auth.getSession();

  if(data.session){
    window.location.href="dashboard-new.html";
  }

}

function toggleMenu(){

  document
    .getElementById("dropdown")
    .classList.toggle("show");

}

document.addEventListener("click",function(e){

  const menu =
    document.querySelector(".menu");

  if(!menu.contains(e.target)){
    document
      .getElementById("dropdown")
      .classList.remove("show");
  }

});

document
  .getElementById("email")
  .addEventListener("keydown",function(e){

    if(e.key==="Enter"){
      sendOTP();
    }

  });

checkSession();

</script>

</body>
</html>
