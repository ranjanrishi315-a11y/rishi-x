  <style>

    label {

    input {

      background: #050505;
      color: white;
      border: 1px solid #333;
      border-radius: 10px;

    }

    input:focus {
      border-color: #ff6a00;

    button {
      width: 100%;

<body>

  <div class="container">

    <div class="logo">
      <h1>⚡ RISHI X</h1>
      <p>PRIVATE FILE SHARING</p>
    </div>

    <div class="card">

      <div class="badge">
        SECURE • PRIVATE • VERIFIED
      </div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to your private vault</p>

      <label>Email Address</label>
      <input id="email" type="email" placeholder="Enter your email">

      <button onclick="sendOTP()">SEND OTP</button>

      <label>Verification Code</label>
      <input id="otp" type="text" maxlength="6" placeholder="Enter 6-digit OTP">

      <button onclick="login()">VERIFY & LOGIN</button>

      <button class="admin" onclick="location.href='admin.html'">👑 ADMIN LOGIN</button>

      <p id="message"></p>

    </div>

    <div class="footer">
      © 2026 RISHI X • Secure File Sharing
    </div>

  </div>

<script>

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

// 👇 Supabase OTP Send Function 👇
async function sendOTP() {
  const email = document.getElementById("email").value.trim();

  if (!email) {
    showMessage("Please enter your email.");
    return;
  }

  showMessage("Sending OTP...");

  const { data, error } = await supabase.auth.signInWithOtp({
    email: email,
  });

  if (error) {
    showMessage("Error: " + error.message);
  } else {
    showMessage("OTP sent! Check your email.");
  }
}

// 👇 Supabase OTP Verify Function 👇
async function login() {
  const email = document.getElementById("email").value.trim();
  const otp = document.getElementById("otp").value.trim();

  if (!email || !otp) {
    showMessage("Enter email and OTP.");
    return;
  }

  showMessage("Verifying...");

  const { data, error } = await supabase.auth.verifyOtp({
    email: email,
    token: otp,
    type: 'email'
  });

  if (error) {
    showMessage("Error: " + error.message);
  } else {
    showMessage("Login successful! Redirecting...");
    
    // Agar login success ho jaye toh agle page par bhejne ke liye niche wali line se '//' hata dein:
    // window.location.href = "dashboard.html"; 
  }
}

</script>
