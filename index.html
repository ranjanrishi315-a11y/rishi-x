<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RECX • Secure Access</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 10%,#24105f 0%,transparent 35%),
    radial-gradient(circle at 90% 80%,#062e55 0%,transparent 35%),
    #030308;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.container{
  width:100%;
  max-width:430px;
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logo h1{
  font-size:38px;
  font-weight:900;
  letter-spacing:3px;
  color:#9b7cff;
  text-shadow:
    0 0 10px #704cff,
    0 0 30px #704cff;
}

.logo p{
  margin-top:7px;
  color:#888;
  font-size:12px;
  letter-spacing:3px;
}

.card{
  padding:28px;
  border:1px solid #30245c;
  border-radius:24px;
  background:rgba(10,9,20,.88);
  box-shadow:
    0 0 35px rgba(102,65,255,.18),
    inset 0 0 30px rgba(105,70,255,.04);
  backdrop-filter:blur(15px);
}

.badge{
  display:inline-block;
  padding:7px 11px;
  border-radius:20px;
  background:#151126;
  border:1px solid #49368b;
  color:#a78bff;
  font-size:10px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:18px;
}

h2{
  font-size:25px;
  margin-bottom:8px;
}

.subtitle{
  color:#888;
  font-size:14px;
  margin-bottom:24px;
}

label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin-bottom:8px;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #302b43;
  background:#080811;
  color:#fff;
  outline:none;
  font-size:14px;
  margin-bottom:14px;
}

input:focus{
  border-color:#8062ff;
  box-shadow:0 0 15px rgba(128,98,255,.18);
}

.login-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#6545ff,#9b5cff);
  color:#fff;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 0 20px rgba(115,70,255,.25);
}

.login-btn:hover{
  filter:brightness(1.12);
}

.login-btn:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.admin-btn{
  width:100%;
  margin-top:10px;
  padding:13px;
  border-radius:12px;
  border:1px solid #3a3450;
  background:#0c0b14;
  color:#ddd;
  cursor:pointer;
  font-weight:bold;
}

.admin-btn:hover{
  background:#151225;
  border-color:#6654a5;
}

#message{
  min-height:20px;
  text-align:center;
  margin-top:15px;
  color:#a996ff;
  font-size:13px;
  line-height:1.5;
}

.social{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:22px;
}

.social a{
  text-decoration:none;
  text-align:center;
  padding:11px 5px;
  border-radius:10px;
  background:#0b0a12;
  border:1px solid #28233a;
  color:#bbb;
  font-size:11px;
  font-weight:bold;
}

.social a:hover{
  border-color:#7058d6;
  color:#fff;
  background:#121020;
}

.footer{
  text-align:center;
  margin-top:20px;
  color:#555;
  font-size:11px;
  line-height:1.6;
}

.security{
  text-align:center;
  margin-top:15px;
  color:#555;
  font-size:10px;
}

@media(max-width:400px){

  .card{
    padding:22px;
  }

  .logo h1{
    font-size:32px;
  }

}

</style>
</head>


<body>

<div class="container">

  <div class="logo">

    <h1>⚡ RECX</h1>

    <p>SECURE DIGITAL ACCESS</p>

  </div>


  <div class="card">

    <div class="badge">
      SECURE • PRIVATE • VERIFIED
    </div>


    <h2>
      Welcome Back
    </h2>

    <p class="subtitle">
      Login to continue to your RECX dashboard.
    </p>


    <label for="email">
      Email Address
    </label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >


    <button
      id="loginButton"
      class="login-btn"
      onclick="sendOTP()"
    >
      SEND LOGIN LINK
    </button>


    <button
      class="admin-btn"
      onclick="location.href='admin.html'"
    >
      👑 ADMIN LOGIN
    </button>


    <p id="message"></p>


    <div class="social">

      <a
        href="https://t.me/panalstoreff"
        target="_blank"
        rel="noopener"
      >
        TELEGRAM
      </a>

      <a
        href="https://whatsapp.com/channel/0029VbDyKyj0VycFxIRkAf2p"
        target="_blank"
        rel="noopener"
      >
        WHATSAPP
      </a>

      <a
        href="https://youtube.com/@recxpanal-te6os?si=wEXVJ6vGkDRTCCRt"
        target="_blank"
        rel="noopener"
      >
        YOUTUBE
      </a>

    </div>

  </div>


  <div class="security">
    🔐 Your account session is protected by Supabase.
  </div>


  <div class="footer">
    © 2026 RECX • Secure Digital Access
  </div>

</div>


<script>

/* =================================
   SUPABASE CONFIGURATION
================================= */

const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";


/*
   IMPORTANT:
   Keep this redirect URL the same
   as your GitHub Pages website.
*/

const REDIRECT_URL =
  "https://ranjanrishi315-a11y.github.io/rishi-x/";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =================================
   MESSAGE
================================= */

function showMessage(text){

  document.getElementById(
    "message"
  ).textContent = text;

}


/* =================================
   SEND LOGIN LINK
================================= */

async function sendOTP(){

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  if(!email){

    showMessage(
      "Please enter your email."
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.textContent =
    "SENDING...";


  showMessage(
    "Sending login link..."
  );


  const {error} =
    await supabaseClient.auth
      .signInWithOtp({

        email: email,

        options:{
          emailRedirectTo:
            REDIRECT_URL
        }

      });


  button.disabled = false;

  button.textContent =
    "SEND LOGIN LINK";


  if(error){

    console.error(error);

    showMessage(
      "Error: " +
      error.message
    );

    return;

  }


  showMessage(
    "✅ Login link sent! Check your email."
  );

}


/* =================================
   ENTER KEY
================================= */

document
  .getElementById("email")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        sendOTP();

      }

    }
  );


/* =================================
   CHECK SESSION
================================= */

async function checkSession(){

  const {data,error} =
    await supabaseClient.auth
      .getSession();


  if(error){

    console.error(error);

    return;

  }


  if(data.session){

    window.location.href =
      "dashboard-new.html";

  }

}


/* =================================
   START
================================= */

checkSession();

</script>

</body>
</html>
