<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>RECX • Admin Dashboard</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,70,0,.14),transparent 30%),
        radial-gradient(circle at 90% 80%,rgba(0,170,255,.12),transparent 30%),
        #050505;
    color:#fff;
}

header{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 5%;
    background:rgba(5,5,5,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:2px;
}

.logo span{
    color:#ff4b00;
}

.header-right{
    display:flex;
    gap:10px;
}

button{
    border:0;
    cursor:pointer;
    font-weight:700;
}

.btn{
    padding:11px 16px;
    border-radius:12px;
    color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
}

.btn:hover{
    background:rgba(255,255,255,.15);
}

.logout{
    background:#ff3b30;
}

.container{
    width:min(1200px,92%);
    margin:30px auto;
}

.hero{
    padding:28px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:24px;
    background:rgba(255,255,255,.045);
    backdrop-filter:blur(20px);
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.hero h1{
    font-size:32px;
    margin-bottom:8px;
}

.hero p{
    color:#999;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-top:20px;
}

.stat{
    padding:20px;
    border-radius:18px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.08);
}

.stat small{
    color:#888;
}

.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:25px 0 15px;
}

.filter{
    padding:12px 14px;
    border-radius:12px;
    color:#fff;
    background:#111;
    border:1px solid #292929;
}

.requests{
    display:grid;
    gap:16px;
}

.request{
    padding:22px;
    border-radius:20px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);
}

.top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.product{
    font-size:20px;
    font-weight:800;
}

.meta{
    color:#999;
    margin-top:7px;
    line-height:1.6;
}

.status{
    padding:7px 11px;
    border-radius:999px;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
}

.pending{
    background:rgba(255,180,0,.14);
    color:#ffc107;
}

.approved{
    background:rgba(0,220,120,.13);
    color:#00dc78;
}

.rejected{
    background:rgba(255,60,60,.13);
    color:#ff5555;
}

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
}

.box{
    padding:14px;
    border-radius:14px;
    background:#0c0c0c;
    border:1px solid #202020;
}

.box label{
    display:block;
    color:#777;
    font-size:11px;
    text-transform:uppercase;
    margin-bottom:6px;
}

.box div{
    word-break:break-word;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

.view{
    background:#168cff;
}

.approve{
    background:#00a968;
}

.reject{
    background:#d83232;
}

.key-area{
    margin-top:16px;
    display:none;
}

.key-area.show{
    display:block;
}

.key-input,
.note-input{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #292929;
    background:#080808;
    color:#fff;
    outline:none;
}

.key-input:focus,
.note-input:focus{
    border-color:#ff4b00;
}

.note-input{
    margin-top:9px;
}

.empty{
    padding:50px;
    text-align:center;
    color:#777;
    border:1px dashed #292929;
    border-radius:20px;
}

.loading{
    text-align:center;
    padding:40px;
    color:#888;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    padding:13px 18px;
    border-radius:12px;
    background:#171717;
    border:1px solid #333;
    display:none;
    z-index:100;
}

@media(max-width:700px){
    .stats{
        grid-template-columns:1fr;
    }

    .details{
        grid-template-columns:1fr;
    }

    .top{
        flex-direction:column;
    }

    .hero h1{
        font-size:26px;
    }

    .toolbar{
        flex-direction:column;
        align-items:stretch;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">REC<span>X</span> <small>ADMIN</small></div>

    <div class="header-right">
        <button class="btn" onclick="loadRequests()">↻ Refresh</button>
        <button class="btn logout" onclick="logout()">Logout</button>
    </div>
</header>

<main class="container">

<section class="hero">
    <h1>Admin Control Center</h1>
    <p>Manage RECX MADS payment requests securely.</p>

    <div class="stats">
        <div class="stat">
            <small>PENDING</small>
            <strong id="pendingCount">0</strong>
        </div>

        <div class="stat">
            <small>APPROVED</small>
            <strong id="approvedCount">0</strong>
        </div>

        <div class="stat">
            <small>REJECTED</small>
            <strong id="rejectedCount">0</strong>
        </div>
    </div>
</section>

<div class="toolbar">
    <h2>Payment Requests</h2>

    <select id="filter" class="filter" onchange="renderRequests()">
        <option value="all">All Requests</option>
        <option value="pending">Pending</option>
        <option value="approved">Approved</option>
        <option value="rejected">Rejected</option>
    </select>
</div>

<section id="requests" class="requests">
    <div class="loading">Loading requests...</div>
</section>

</main>

<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const BUCKET =
"user-files";

const {createClient} =
supabase;

const db =
createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let requests = [];


/* ==========================================
   TOAST
========================================== */

function toast(message){

    const el =
        document.getElementById("toast");

    el.textContent =
        message;

    el.style.display =
        "block";

    setTimeout(()=>{
        el.style.display =
            "none";
    },2500);
}


/* ==========================================
   AUTH + ADMIN CHECK
========================================== */

async function checkAdmin(){

    const {
        data:{session}
    } =
    await db.auth.getSession();

    if(!session){

        alert(
            "Admin session not found. Please login again."
        );

        window.location.href =
            "admin.html";

        return false;
    }

    const {
        data,
        error
    } =
    await db.rpc("is_admin");

    if(error || data !== true){

        alert(
            "Access denied."
        );

        await db.auth.signOut();

        window.location.href =
            "admin.html";

        return false;
    }

    return true;
}


/* ==========================================
   LOAD REQUESTS
========================================== */

async function loadRequests(){

    const ok =
        await checkAdmin();

    if(!ok) return;

    document.getElementById("requests")
        .innerHTML =
        `<div class="loading">Loading requests...</div>`;

    const {
        data,
        error
    } =
    await db
        .from("mads_requests")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        document.getElementById("requests")
            .innerHTML =
            `<div class="empty">
                Failed to load requests.<br>
                ${escapeHtml(error.message)}
            </div>`;

        return;
    }

    requests =
        data || [];

    updateStats();
    renderRequests();
}


/* ==========================================
   STATS
========================================== */

function updateStats(){

    document.getElementById("pendingCount")
        .textContent =
        requests.filter(x =>
            x.status === "pending"
        ).length;

    document.getElementById("approvedCount")
        .textContent =
        requests.filter(x =>
            x.status === "approved"
        ).length;

    document.getElementById("rejectedCount")
        .textContent =
        requests.filter(x =>
            x.status === "rejected"
        ).length;
}


/* ==========================================
   RENDER
========================================== */

function renderRequests(){

    const filter =
        document.getElementById("filter")
            .value;

    const list =
        filter === "all"
        ? requests
        : requests.filter(x =>
            x.status === filter
        );

    const container =
        document.getElementById("requests");

    if(!list.length){

        container.innerHTML =
        `<div class="empty">
            No requests found.
        </div>`;

        return;
    }

    container.innerHTML =
        list.map(renderRequest).join("");
}


/* ==========================================
   REQUEST CARD
========================================== */

function renderRequest(r){

    const date =
        new Date(r.created_at)
        .toLocaleString();

    return `
    <article class="request">

        <div class="top">

            <div>
                <div class="product">
                    ${escapeHtml(r.product)}
                </div>

                <div class="meta">
                    ${escapeHtml(r.plan)}
                    • ₹${escapeHtml(r.amount)}
                    <br>
                    ${escapeHtml(date)}
                </div>
            </div>

            <span class="status ${escapeHtml(r.status)}">
                ${escapeHtml(r.status)}
            </span>

        </div>


        <div class="details">

            <div class="box">
                <label>User Email</label>
                <div>
                    ${escapeHtml(r.user_email || "Not available")}
                </div>
            </div>

            <div class="box">
                <label>Request ID</label>
                <div>
                    ${escapeHtml(r.id)}
                </div>
            </div>

            <div class="box">
                <label>Product</label>
                <div>
                    ${escapeHtml(r.product)}
                </div>
            </div>

            <div class="box">
                <label>Plan / Amount</label>
                <div>
                    ${escapeHtml(r.plan)}
                    • ₹${escapeHtml(r.amount)}
                </div>
            </div>

        </div>


        <div class="actions">

            ${
                r.payment_screenshot
                ?
                `<button class="btn view"
                    onclick="viewScreenshot('${escapeAttr(r.payment_screenshot)}')">
                    🖼 View Payment
                </button>`
                :
                `<button class="btn" disabled>
                    No Screenshot
                </button>`
            }

            ${
                r.status === "pending"
                ?
                `
                <button class="btn approve"
                    onclick="showKeyArea('${escapeAttr(r.id)}')">
                    ✓ Approve
                </button>

                <button class="btn reject"
                    onclick="rejectRequest('${escapeAttr(r.id)}')">
                    ✕ Reject
                </button>
                `
                :
                ""
            }

        </div>


        ${
            r.status === "pending"
            ?
            `
            <div
                class="key-area"
                id="key-${escapeAttr(r.id)}">

                <input
                    class="key-input"
                    id="key-input-${escapeAttr(r.id)}"
                    placeholder="Enter customer key">

                <input
                    class="note-input"
                    id="note-input-${escapeAttr(r.id)}"
                    placeholder="Admin note (optional)">

                <div class="actions">

                    <button
                        class="btn approve"
                        onclick="approveRequest('${escapeAttr(r.id)}')">
                        ✓ Confirm Approval
                    </button>

                    <button
                        class="btn"
                        onclick="hideKeyArea('${escapeAttr(r.id)}')">
                        Cancel
                    </button>

                </div>

            </div>
            `
            :
            ""
        }


        ${
            r.admin_key
            ?
            `
            <div class="box" style="margin-top:16px">
                <label>Delivered Key</label>
                <div>${escapeHtml(r.admin_key)}</div>
            </div>
            `
            :
            ""
        }


        ${
            r.admin_note
            ?
            `
            <div class="box" style="margin-top:10px">
                <label>Admin Note</label>
                <div>${escapeHtml(r.admin_note)}</div>
            </div>
            `
            :
            ""
        }

    </article>
    `;
}


/* ==========================================
   APPROVAL UI
========================================== */

function showKeyArea(id){

    const el =
        document.getElementById("key-"+id);

    if(el)
        el.classList.add("show");
}


function hideKeyArea(id){

    const el =
        document.getElementById("key-"+id);

    if(el)
        el.classList.remove("show");
}


/* ==========================================
   APPROVE
========================================== */

async function approveRequest(id){

    const keyInput =
        document.getElementById(
            "key-input-"+id
        );

    const noteInput =
        document.getElementById(
            "note-input-"+id
        );

    const key =
        keyInput
        ? keyInput.value.trim()
        : "";

    const note =
        noteInput
        ? noteInput.value.trim()
        : "";

    if(!key){

        alert(
            "Please enter the key."
        );

        return;
    }

    const {
        error
    } =
    await db
        .from("mads_requests")
        .update({
            status:"approved",
            admin_key:key,
            admin_note:note,
            updated_at:new Date().toISOString()
        })
        .eq("id",id);

    if(error){

        alert(
            "Approval failed: "+
            error.message
        );

        return;
    }

    toast(
        "Request approved successfully."
    );

    await loadRequests();
}


/* ==========================================
   REJECT
========================================== */

async function rejectRequest(id){

    const note =
        prompt(
            "Reason / admin note (optional):"
        );

    if(note === null)
        return;

    const {
        error
    } =
    await db
        .from("mads_requests")
        .update({
            status:"rejected",
            admin_note:note,
            updated_at:new Date().toISOString()
        })
        .eq("id",id);

    if(error){

        alert(
            "Reject failed: "+
            error.message
        );

        return;
    }

    toast(
        "Request rejected."
    );

    await loadRequests();
}


/* ==========================================
   PAYMENT SCREENSHOT
========================================== */

async function viewScreenshot(path){

    if(!path){

        alert(
            "Payment screenshot not found."
        );

        return;
    }

    const {
        data,
        error
    } =
    await db
        .storage
        .from(BUCKET)
        .createSignedUrl(
            path,
            300
        );

    if(error){

        alert(
            "Screenshot access failed: "+
            error.message
        );

        return;
    }

    window.open(
        data.signedUrl,
        "_blank"
    );
}


/* ==========================================
   LOGOUT
========================================== */

async function logout(){

    await db.auth.signOut();

    sessionStorage.removeItem(
        "rishi_x_admin_logged_in"
    );

    window.location.href =
        "admin.html";
}


/* ==========================================
   SECURITY HELPERS
========================================== */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function escapeAttr(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'");
}


/* ==========================================
   START
========================================== */

loadRequests();

</script>

</body>
  </html>
