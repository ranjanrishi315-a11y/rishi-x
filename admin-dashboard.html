<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X • Admin Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#401500,transparent 45%),
    #050505;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 5%;
  background:#090909;
  border-bottom:1px solid #252525;
}

.logo{
  color:#ff6a00;
  font-size:24px;
  font-weight:900;
  text-shadow:0 0 15px #ff6a00;
}

.header-buttons{
  display:flex;
  gap:10px;
}

.header-buttons button{
  padding:9px 14px;
  border:1px solid #ff6a00;
  border-radius:8px;
  background:transparent;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.header-buttons button:hover{
  background:#ff6a00;
}

main{
  width:92%;
  max-width:1100px;
  margin:35px auto;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:32px;
}

.welcome p{
  margin-top:8px;
  color:#888;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.card{
  padding:25px;
  background:#111;
  border:1px solid #252525;
  border-radius:15px;
  box-shadow:0 0 20px #ff6a0012;
}

.card h3{
  color:#888;
  font-size:13px;
  margin-bottom:12px;
}

.number{
  color:#ff6a00;
  font-size:28px;
  font-weight:bold;
}

.section{
  margin-top:25px;
  padding:25px;
  background:#111;
  border:1px solid #252525;
  border-radius:15px;
}

.info{
  margin-top:12px;
  padding:15px;
  background:#080808;
  border:1px solid #292929;
  border-radius:10px;
}

.label{
  color:#777;
  font-size:11px;
  margin-bottom:6px;
}

.value{
  word-break:break-all;
}

.status{
  margin-top:18px;
  padding:13px;
  text-align:center;
  border-radius:10px;
  background:#092014;
  border:1px solid #1d7138;
  color:#63e69a;
}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:26px;
  }

  .header-buttons button{
    padding:8px 10px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    👑 RISHI X
  </div>

  <div class="header-buttons">

    <button onclick="goUserDashboard()">
      🏠 User Dashboard
    </button>

    <button onclick="logoutAdmin()">
      Logout
    </button>

  </div>

</header>


<main>

  <section class="welcome">

    <h1>
      👑 Admin Dashboard
    </h1>

    <p>
      Welcome to the RISHI X administration panel.
    </p>

  </section>


  <section class="grid">

    <div class="card">

      <h3>
        ACCESS LEVEL
      </h3>

      <div class="number">
        ADMIN
      </div>

    </div>


    <div class="card">

      <h3>
        STATUS
      </h3>

      <div class="number">
        ACTIVE
      </div>

    </div>

  </section>


  <section class="section">

    <h2>
      🔐 Admin Information
    </h2>


    <div class="info">

      <div class="label">
        ADMIN ID
      </div>

      <div class="value">
        f3ffeb51-70a6-4a44-99fb-f4ff1fa2aedf
      </div>

    </div>


    <div class="info">

      <div class="label">
        ACCESS
      </div>

      <div class="value">
        Administrator
      </div>

    </div>


    <div class="status">
      ✅ Admin access verified successfully.
    </div>

  </section>


  <section class="section">

    <h2>
      🛠️ Admin Tools
    </h2>

    <div class="info">
      Admin tools can be added here later.
    </div>

  </section>

</main>


<script>

/* =================================
   ADMIN SESSION
================================= */

const ADMIN_SESSION_KEY =
  "rishi_x_admin_logged_in";


/* =================================
   CHECK ADMIN LOGIN
================================= */

function checkAdminLogin(){

  const loggedIn =
    sessionStorage.getItem(
      ADMIN_SESSION_KEY
    );

  if(loggedIn !== "true"){

    window.location.href =
      "admin.html";

    return false;
  }

  return true;
}


/* =================================
   USER DASHBOARD
================================= */

function goUserDashboard(){

  window.location.href =
    "dashboard.html";

}


/* =================================
   ADMIN LOGOUT
================================ */

function logoutAdmin(){

  sessionStorage.removeItem(
    ADMIN_SESSION_KEY
  );

  window.location.href =
    "admin.html";

}


/* =================================
   START
================================ */

checkAdminLogin();

</script>

</body>
</html>
