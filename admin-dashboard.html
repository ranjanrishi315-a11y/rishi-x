<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RECX • Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(255,100,0,.08),transparent 30%),
        radial-gradient(circle at 90% 90%,rgba(255,50,0,.07),transparent 30%),
        #f5f7fb;
    color:#111;
}

header{
    position:sticky;
    top:0;
    z-index:10;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(0,0,0,.07);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand-logo{
    width:45px;
    height:45px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-weight:900;
    background:linear-gradient(135deg,#ff5500,#ff8900);
    box-shadow:0 8px 20px rgba(255,90,0,.22);
}

.brand-text{
    font-weight:900;
    font-size:19px;
}

.brand-sub{
    font-size:11px;
    color:#888;
    margin-top:2px;
}

.logout{
    border:0;
    padding:10px 16px;
    border-radius:12px;
    background:#111;
    color:white;
    font-weight:700;
    cursor:pointer;
}

main{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:30px 20px 60px;
}

.hero{
    background:linear-gradient(135deg,#fff,#fff8f2);
    border:1px solid rgba(0,0,0,.07);
    border-radius:25px;
    padding:28px;
    margin-bottom:22px;
    box-shadow:0 15px 45px rgba(0,0,0,.07);
}

.hero h1{
    font-size:30px;
    margin-bottom:8px;
}

.hero p{
    color:#777;
    font-size:14px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:22px;
}

.stat{
    background:white;
    border:1px solid #eee;
    border-radius:18px;
    padding:20px;
}

.stat-title{
    font-size:12px;
    color:#888;
    margin-bottom:8px;
}

.stat-value{
    font-size:28px;
    font-weight:900;
}

.section-title{
    font-size:21px;
    font-weight:900;
    margin:28px 0 15px;
}

.filters{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-bottom:15px;
}

.filter{
    border:1px solid #ddd;
    background:white;
    padding:9px 14px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.filter.active{
    background:#ff6500;
    border-color:#ff6500;
    color:white;
}

.requests{
    display:grid;
    gap:15px;
}

.request{
    background:rgba(255,255,255,.94);
    border:1px solid #e8e8e8;
    border-radius:22px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.05);
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.product{
    font-size:18px;
    font-weight:900;
}

.plan{
    color:#777;
    margin-top:5px;
    font-size:13px;
}

.amount{
    font-weight:900;
    font-size:18px;
}

.status{
    display:inline-block;
    margin-top:13px;
    padding:7px 11px;
    border-radius:10px;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

.status.pending{
    background:#fff2dc;
    color:#a85c00;
}

.status.approved{
    background:#e9f9ef;
    color:#19733b;
}

.status.rejected{
    background:#ffeaea;
    color:#b32d2d;
}

.info{
    margin-top:15px;
    display:grid;
    gap:7px;
    font-size:13px;
    color:#666;
    word-break:break-word;
}

.info strong{
    color:#222;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:9px;
    margin-top:17px;
}

.action{
    border:0;
    border-radius:11px;
    padding:10px 14px;
    font-size:13px;
    font-weight:800;
    cursor:pointer;
}

.view{
    background:#111;
    color:white;
}

.approve{
    background:#18a957;
    color:white;
}

.reject{
    background:#e33a3a;
    color:white;
}

.key-box{
    margin-top:14px;
    padding:14px;
    border-radius:14px;
    background:#f4f6f8;
    border:1px solid #e2e2e2;
}

.key-box strong{
    display:block;
    margin-bottom:6px;
}

.key{
    font-family:monospace;
    font-size:14px;
    word-break:break-all;
}

.empty{
    background:white;
    border:1px dashed #ccc;
    border-radius:20px;
    padding:40px 20px;
    text-align:center;
    color:#888;
}

.loading{
    text-align:center;
    padding:35px;
    color:#777;
}

footer{
    text-align:center;
    color:#999;
    font-size:11px;
    padding:20px;
}

@media(max-width:700px){

    .header-inner{
        padding:13px 15px;
    }

    main{
        padding:20px 14px 45px;
    }

    .hero{
        padding:21px;
    }

    .hero h1{
        font-size:25px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .request-top{
        flex-direction:column;
    }

    .amount{
        font-size:16px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="brand">

            <div class="brand-logo">
                RX
            </div>

            <div>
                <div class="brand-text">
                    RECX ADMIN
                </div>

                <div class="brand-sub">
                    MADS REQUEST MANAGEMENT
                </div>
            </div>

        </div>

        <button
            class="logout"
            onclick="logout()">
            Logout
        </button>

    </div>

</header>


<main>

    <section class="hero">

        <h1>
            Admin Dashboard
        </h1>

        <p>
            Manage payment requests, approvals and key delivery.
        </p>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">
                    Total Requests
                </div>

                <div
                    id="totalCount"
                    class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Pending
                </div>

                <div
                    id="pendingCount"
                    class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Approved
                </div>

                <div
                    id="approvedCount"
                    class="stat-value">
                    0
                </div>
            </div>

        </div>

    </section>


    <div class="section-title">
        Requests
    </div>


    <div class="filters">

        <button
            class="filter active"
            onclick="setFilter('all',this)">
            All
        </button>

        <button
            class="filter"
            onclick="setFilter('pending',this)">
            Pending
        </button>

        <button
            class="filter"
            onclick="setFilter('approved',this)">
            Approved
        </button>

        <button
            class="filter"
            onclick="setFilter('rejected',this)">
            Rejected
        </button>

    </div>


    <div
        id="requests"
        class="requests">

        <div class="loading">
            Loading requests...
        </div>

    </div>

</main>


<footer>
    Powered by Rishi X & Shiva
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY,
    {
        auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
        }
    }
);


/* =========================
   VARIABLES
========================= */

let allRequests = [];
let currentFilter = "all";


/* =========================
   ESCAPE HTML
========================= */

function esc(value){

    if(value === null || value === undefined){
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================
   ADMIN AUTH CHECK
========================= */

async function verifyAdmin(){

    const {
        data:{
            session
        },
        error
    } = await db.auth.getSession();

    if(error || !session){

        window.location.replace(
            "admin.html"
        );

        return false;
    }


    const {
        data:isAdmin,
        error:adminError
    } = await db.rpc("is_admin");


    if(adminError){

        console.error(adminError);

        await db.auth.signOut();

        window.location.replace(
            "admin.html"
        );

        return false;
    }


    if(isAdmin !== true){

        await db.auth.signOut();

        window.location.replace(
            "admin.html"
        );

        return false;
    }


    return true;
}


/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests(){

    const ok =
        await verifyAdmin();

    if(!ok){
        return;
    }


    const {
        data,
        error
    } = await db
        .from("mads_requests")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        document.getElementById("requests").innerHTML =
            `<div class="empty">
                Unable to load requests.<br>
                ${esc(error.message)}
            </div>`;

        return;
    }


    allRequests = data || [];

    updateStats();

    renderRequests();
}


/* =========================
   STATS
========================= */

function updateStats(){

    const total =
        allRequests.length;

    const pending =
        allRequests.filter(
            x=>x.status==="pending"
        ).length;

    const approved =
        allRequests.filter(
            x=>x.status==="approved"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent = total;

    document.getElementById(
        "pendingCount"
    ).textContent = pending;

    document.getElementById(
        "approvedCount"
    ).textContent = approved;
}


/* =========================
   FILTER
========================= */

function setFilter(filter,button){

    currentFilter = filter;

    document
        .querySelectorAll(".filter")
        .forEach(
            x=>x.classList.remove("active")
        );

    button.classList.add("active");

    renderRequests();
}


/* =========================
   RENDER
========================= */

function renderRequests(){

    const box =
        document.getElementById("requests");


    let list = allRequests;


    if(currentFilter !== "all"){

        list =
            allRequests.filter(
                x=>x.status===currentFilter
            );

    }


    if(!list.length){

        box.innerHTML =
            `<div class="empty">
                No ${currentFilter==="all" ? "" : currentFilter+" "}requests found.
            </div>`;

        return;
    }


    box.innerHTML =
        list.map(renderRequest).join("");
}


/* =========================
   REQUEST CARD
========================= */

function renderRequest(r){

    const date =
        r.created_at
        ? new Date(r.created_at).toLocaleString()
        : "-";


    let actionHtml = "";


    if(r.status === "pending"){

        actionHtml = `

            <div class="actions">

                <button
                    class="action view"
                    onclick="viewPayment('${esc(r.id)}','${esc(r.payment_screenshot || "")}')">
                    View Payment
                </button>

                <button
                    class="action approve"
                    onclick="approveRequest('${esc(r.id)}')">
                    Approve
                </button>

                <button
                    class="action reject"
                    onclick="rejectRequest('${esc(r.id)}')">
                    Reject
                </button>

            </div>
        `;

    }else{

        if(r.payment_screenshot){

            actionHtml = `
                <div class="actions">

                    <button
                        class="action view"
                        onclick="viewPayment('${esc(r.id)}','${esc(r.payment_screenshot)}')">
                        View Payment
                    </button>

                </div>
            `;
        }

    }


    let resultHtml = "";


    if(r.status === "approved" && r.admin_key){

        resultHtml = `

            <div class="key-box">

                <strong>
                    Delivered Key
                </strong>

                <div class="key">
                    ${esc(r.admin_key)}
                </div>

            </div>

        `;

    }


    if(r.status === "rejected" && r.admin_note){

        resultHtml = `

            <div class="key-box">

                <strong>
                    Rejection Note
                </strong>

                <div>
                    ${esc(r.admin_note)}
                </div>

            </div>

        `;

    }


    return `

        <div class="request">

            <div class="request-top">

                <div>

                    <div class="product">
                        ${esc(r.product)}
                    </div>

                    <div class="plan">
                        ${esc(r.plan)}
                    </div>

                </div>

                <div class="amount">
                    ₹${esc(r.amount)}
                </div>

            </div>


            <span class="status ${esc(r.status)}">
                ${esc(r.status)}
            </span>


            <div class="info">

                <div>
                    <strong>Email:</strong>
                    ${esc(r.user_email || "-")}
                </div>

                <div>
                    <strong>Request ID:</strong>
                    ${esc(r.id)}
                </div>

                <div>
                    <strong>Created:</strong>
                    ${esc(date)}
                </div>

            </div>


            ${resultHtml}

            ${actionHtml}

        </div>

    `;
}


/* =========================
   VIEW PAYMENT
========================= */

async function viewPayment(id,path){

    if(!path){

        alert(
            "Payment screenshot not found."
        );

        return;
    }


    const ok =
        await verifyAdmin();

    if(!ok){
        return;
    }


    const {
        data,
        error
    } = await db
        .storage
        .from("user-files")
        .createSignedUrl(
            path,
            300
        );


    if(error){

        alert(
            "Unable to open payment screenshot:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    if(data && data.signedUrl){

        window.open(
            data.signedUrl,
            "_blank"
        );

    }else{

        alert(
            "Payment screenshot URL was not created."
        );

    }

}


/* =========================
   APPROVE
========================= */

async function approveRequest(id){

    const key =
        prompt(
            "Enter the key to deliver to the user:"
        );


    if(key === null){
        return;
    }


    const cleanKey =
        key.trim();


    if(!cleanKey){

        alert(
            "Please enter a key."
        );

        return;
    }


    const ok =
        await verifyAdmin();

    if(!ok){
        return;
    }


    const {
        error
    } = await db
        .from("mads_requests")
        .update({
            status:"approved",
            admin_key:cleanKey,
            admin_note:null
        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Approve failed:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "Request approved successfully."
    );


    await loadRequests();
}


/* =========================
   REJECT
========================= */

async function rejectRequest(id){

    const note =
        prompt(
            "Enter rejection reason:"
        );


    if(note === null){
        return;
    }


    const cleanNote =
        note.trim();


    if(!cleanNote){

        alert(
            "Please enter a rejection reason."
        );

        return;
    }


    const ok =
        await verifyAdmin();

    if(!ok){
        return;
    }


    const {
        error
    } = await db
        .from("mads_requests")
        .update({
            status:"rejected",
            admin_note:cleanNote,
            admin_key:null
        })
        .eq(
            "id",
            id
        );


    if(error){

        alert(
            "Reject failed:\n" +
            error.message
        );

        console.error(error);

        return;
    }


    alert(
        "Request rejected."
    );


    await loadRequests();
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    await db.auth.signOut();

    window.location.replace(
        "admin.html"
    );
}


/* =========================
   AUTH STATE
========================= */

db.auth.onAuthStateChange(
    (event,session)=>{

        console.log(
            "Dashboard auth:",
            event
        );

        if(
            event === "SIGNED_OUT"
        ){

            window.location.replace(
                "admin.html"
            );
        }

    }
);


/* =========================
   START
========================= */

loadRequests();


/* =========================
   AUTO REFRESH
========================= */

setInterval(
    async()=>{
        await loadRequests();
    },
    15000
);

</script>

</body>
</html>
