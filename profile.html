<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RECX • Profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:#f5f7fb;
  color:#111827;
}

header{
  height:70px;
  padding:0 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-size:25px;
  font-weight:900;
}

.logo span{
  color:#2563eb;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.header-buttons button{
  border:1px solid #ddd;
  background:#fff;
  padding:9px 13px;
  border-radius:9px;
  cursor:pointer;
}

.container{
  width:92%;
  max-width:700px;
  margin:45px auto;
}

.title{
  margin-bottom:20px;
}

.title h1{
  font-size:30px;
}

.title p{
  color:#6b7280;
  margin-top:6px;
}

.profile-card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:20px;
  padding:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}

.avatar{
  width:80px;
  height:80px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#2563eb;
  color:#fff;
  font-size:30px;
  font-weight:bold;
}

.email{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.status{
  width:max-content;
  margin:9px auto 25px;
  padding:6px 12px;
  border-radius:20px;
  background:#dcfce7;
  color:#15803d;
  font-size:12px;
  font-weight:bold;
}

.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.box{
  padding:16px;
  border:1px solid #e5e7eb;
  border-radius:12px;
  background:#fafafa;
}

.box small{
  display:block;
  color:#6b7280;
  font-size:11px;
  margin-bottom:7px;
}

.box b{
  font-size:14px;
  word-break:break-word;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.actions button{
  flex:1;
  height:48px;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.dashboard{
  background:#2563eb;
  color:#fff;
}

.logout{
  background:#fee2e2;
  color:#b91c1c;
}

footer{
  text-align:center;
  margin:35px 0;
  color:#777;
  font-size:11px;
}

@media(max-width:550px){
  .info{
    grid-template-columns:1fr;
  }

  header{
    padding:0 4%;
  }

  .container{
    width:94%;
    margin:30px auto;
  }

  .profile-card{
    padding:22px;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ <span>RECX</span>
  </div>

  <div class="header-buttons">
    <button onclick="goDashboard()">Dashboard</button>
    <button onclick="logout()">Logout</button>
  </div>

</header>

<div class="container">

  <div class="title">
    <h1>My Profile</h1>
    <p>Manage your RECX account</p>
  </div>

  <div class="profile-card">

    <div class="avatar" id="avatar">
      R
    </div>

    <div class="email" id="email">
      Loading...
    </div>

    <div class="status">
      ● ACCOUNT ACTIVE
    </div>

    <div class="info">

      <div class="box">
        <small>Email</small>
        <b id="emailInfo">Loading...</b>
      </div>

      <div class="box">
        <small>User ID</small>
        <b id="userId">Loading...</b>
      </div>

      <div class="box">
        <small>Account Created</small>
        <b id="createdAt">Loading...</b>
      </div>

      <div class="box">
        <small>Files</small>
        <b id="fileCount">Loading...</b>
      </div>

    </div>

    <div class="actions">

      <button
        class="dashboard"
        onclick="goDashboard()">
        Dashboard
      </button>

      <button
        class="logout"
        onclick="logout()">
        Logout
      </button>

    </div>

  </div>

</div>

<footer>
  Powered by Rishi X & Shiva
</footer>

<script>

const SUPABASE_URL =
"https://asdbxlnttlsuhhnqeywa.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function loadProfile(){

  const {data,error} =
    await supabaseClient.auth.getUser();

  if(error || !data.user){

    window.location.href="index.html";
    return;

  }

  const user=data.user;

  const email =
    user.email || "No email";

  document.getElementById("email")
    .textContent=email;

  document.getElementById("emailInfo")
    .textContent=email;

  document.getElementById("userId")
    .textContent=user.id;

  document.getElementById("avatar")
    .textContent=
    email.charAt(0).toUpperCase();

  if(user.created_at){

    document.getElementById("createdAt")
      .textContent=
      new Date(user.created_at)
      .toLocaleDateString(
        "en-IN",
        {
          day:"2-digit",
          month:"short",
          year:"numeric"
        }
      );

  }

  const {count} =
    await supabaseClient
      .from("mads_requests")
      .select("*",{count:"exact",head:true})
      .eq("user_id",user.id);

  document.getElementById("fileCount")
    .textContent =
    count ?? 0;
}

function goDashboard(){
  window.location.href="dashboard-new.html";
}

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href="index.html";
}

loadProfile();

</script>

</body>
</html>
