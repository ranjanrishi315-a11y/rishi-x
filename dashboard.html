
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RISHI X Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:
    radial-gradient(circle at top,#401500,transparent 45%),
    #050505;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 5%;
  border-bottom:1px solid #252525;
  background:#090909;
}

.logo{
  color:#ff6a00;
  font-size:25px;
  font-weight:900;
  text-shadow:0 0 15px #ff6a00;
}

.logout{
  padding:9px 16px;
  border:1px solid #ff6a00;
  border-radius:8px;
  background:transparent;
  color:white;
  cursor:pointer;
}

main{
  width:92%;
  max-width:1000px;
  margin:35px auto;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
}

.welcome p{
  color:#888;
  margin-top:7px;
}

.upload{
  border:1px solid #ff6a00;
  border-radius:18px;
  padding:25px;
  background:#111;
  text-align:center;
  box-shadow:0 0 25px #ff6a0025;
}

.upload h2{
  margin-bottom:10px;
}

.upload p{
  color:#888;
  font-size:14px;
}

.file{
  margin-top:20px;
  width:100%;
  padding:15px;
  border:1px dashed #ff6a00;
  border-radius:10px;
  background:#070707;
  color:#aaa;
}

.upload button{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:10px;
  background:linear-gradient(90deg,#ff3d00,#ff8500);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.files{
  margin-top:30px;
}

.files h2{
  margin-bottom:15px;
}

.empty{
  padding:30px;
  text-align:center;
  color:#777;
  border:1px solid #222;
  border-radius:15px;
  background:#0d0d0d;
}
</style>
</head>

<body>

<header>

  <div class="logo">
    ⚡ RISHI X
  </div>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</header>


<main>

  <section class="welcome">

    <h1>My Dashboard</h1>

    <p>
      Manage your private files securely.
    </p>

  </section>


  <section class="upload">

    <h2>📤 Upload File</h2>

    <p>
      Your files will appear in your private dashboard.
    </p>

    <input
      class="file"
      type="file"
      id="file"
      accept="image/*"
    >

    <button onclick="uploadFile()">
      UPLOAD FILE
    </button>

    <p id="message"></p>

  </section>


  <section class="files">

    <h2>🗂️ My Files</h2>

    <div class="empty" id="fileList">

      No files uploaded yet.

    </div>

  </section>

</main>


<script>

function uploadFile(){

  const file =
    document.getElementById("file").files[0];

  const message =
    document.getElementById("message");

  if(!file){

    message.textContent =
      "Please select an image.";

    return;
  }

  message.textContent =
    "Backend upload system will be connected next.";

}


function logout(){

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
