<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RISHI X Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;

      background:
        radial-gradient(circle at top, #401500, transparent 45%),
        #050505;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 18px 5%;

      background: #090909;
      border-bottom: 1px solid #252525;
    }

    .logo {
      color: #ff6a00;
      font-size: 25px;
      font-weight: 900;
      text-shadow: 0 0 15px #ff6a00;
    }

    .logout {
      padding: 9px 16px;
      border: 1px solid #ff6a00;
      border-radius: 8px;
      background: transparent;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .logout:hover {
      background: #ff6a00;
    }

    main {
      width: 92%;
      max-width: 1000px;
      margin: 35px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 30px;
    }

    .welcome p {
      color: #888;
      margin-top: 7px;
    }

    .upload {
      border: 1px solid #ff6a00;
      border-radius: 18px;
      padding: 25px;
      background: #111;
      text-align: center;
      box-shadow: 0 0 25px #ff6a0025;
    }

    .upload h2 {
      margin-bottom: 10px;
    }

    .upload p {
      color: #888;
      font-size: 14px;
    }

    .file {
      margin-top: 20px;
      width: 100%;
      padding: 15px;
      border: 1px dashed #ff6a00;
      border-radius: 10px;
      background: #070707;
      color: #aaa;
    }

    .upload button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #ff3d00, #ff8500);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .upload button:hover {
      opacity: 0.9;
    }

    .files {
      margin-top: 30px;
    }

    .files h2 {
      margin-bottom: 15px;
    }

    .file-list {
      display: grid;
      gap: 12px;
    }

    .file-card {
      padding: 16px;
      border: 1px solid #252525;
      border-radius: 12px;
      background: #0d0d0d;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #eee;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .file-actions button {
      padding: 8px 12px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #ff6a00;
      background: transparent;
      color: white;
    }

    .file-actions button:hover {
      background: #ff6a00;
    }

    .delete-btn {
      border-color: #ff3d00 !important;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #777;
      border: 1px solid #222;
      border-radius: 15px;
      background: #0d0d0d;
    }

    #message {
      min-height: 20px;
      margin-top: 15px;
      color: #ff9b63;
      text-align: center;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    @media (max-width: 600px) {

      .file-card {
        flex-direction: column;
        align-items: stretch;
      }

      .file-actions {
        width: 100%;
      }

      .file-actions button {
        flex: 1;
      }

    }

  </style>

</head>


<body>


<header>

  <div class="logo">
    ⚡ RISHI X
  </div>

  <button
    class="logout"
    onclick="logout()">

    Logout

  </button>

</header>


<main>


  <section class="welcome">

    <h1>
      My Dashboard
    </h1>

    <p id="userEmail">
      Loading account...
    </p>

  </section>


  <section class="upload">

    <h2>
      📤 Upload File
    </h2>

    <p>
      Your files are stored in your private vault.
    </p>


    <input
      class="file"
      type="file"
      id="file"
    >


    <button
      id="uploadButton"
      onclick="uploadFile()">

      UPLOAD FILE

    </button>


    <p id="message"></p>

  </section>


  <section class="files">

    <h2>
      🗂️ My Files
    </h2>


    <div
      id="fileList"
      class="file-list">

      <div class="loading">
        Loading files...
      </div>

    </div>

  </section>


</main>


<script>


/* =================================
   SUPABASE CONFIGURATION
   ================================= */


const SUPABASE_URL =
  "https://asdbxlnttlsuhhnqeywa.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_GIzm11dFWDJmu9cQGAJy_w_432UbSU5";


const BUCKET_NAME =
  "user-files";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


let currentUser = null;


/* =================================
   MESSAGE
   ================================= */


function showMessage(text) {

  document.getElementById("message")
    .textContent = text;

}


/* =================================
   CHECK LOGIN
   ================================= */


async function checkLogin() {

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();


  if (error) {

    console.error(error);

    window.location.href =
      "index.html";

    return;

  }


  if (!data.session) {

    window.location.href =
      "index.html";

    return;

  }


  currentUser =
    data.session.user;


  document.getElementById("userEmail")
    .textContent =
      currentUser.email;


  await loadFiles();

}


/* =================================
   UPLOAD FILE
   ================================= */


async function uploadFile() {

  const input =
    document.getElementById("file");

  const file =
    input.files[0];


  if (!file) {

    showMessage(
      "Please select a file first."
    );

    return;

  }


  if (!currentUser) {

    showMessage(
      "You are not logged in."
    );

    return;

  }


  const button =
    document.getElementById("uploadButton");


  button.disabled = true;

  button.textContent =
    "UPLOADING...";


  showMessage(
    "Uploading file..."
  );


  /*
    Each user gets their own folder:

    user-id/
      filename
  */


  const filePath =
    currentUser.id +
    "/" +
    Date.now() +
    "_" +
    file.name;


  const {
    error
  } = await supabaseClient.storage
    .from(BUCKET_NAME)
    .upload(
      filePath,
      file,
      {
        cacheControl: "3600",
        upsert: false
      }
    );


  button.disabled = false;

  button.textContent =
    "UPLOAD FILE";


  if (error) {

    console.error(error);

    showMessage(
      "Upload failed: " +
      error.message
    );

    return;

  }


  showMessage(
    "File uploaded successfully!"
  );


  input.value = "";


  await loadFiles();

}


/* =================================
   LOAD USER FILES
   ================================= */


async function loadFiles() {

  const fileList =
    document.getElementById("fileList");


  fileList.innerHTML =
    '<div class="loading">Loading files...</div>';


  if (!currentUser) {

    return;

  }


  const {
    data,
    error
  } = await supabaseClient.storage
    .from(BUCKET_NAME)
    .list(
      currentUser.id,
      {
        limit: 100,
        offset: 0,
        sortBy: {
          column: "created_at",
          order: "desc"
        }
      }
    );


  if (error) {

    console.error(error);

    fileList.innerHTML =
      '<div class="empty">Unable to load files.</div>';

    return;

  }


  if (!data || data.length === 0) {

    fileList.innerHTML =
      '<div class="empty">No files uploaded yet.</div>';

    return;

  }


  fileList.innerHTML = "";


  data.forEach(function(file) {

    const card =
      document.createElement("div");

    card.className =
      "file-card";


    const name =
      document.createElement("div");

    name.className =
      "file-name";

    name.textContent =
      file.name;


    const actions =
      document.createElement("div");

    actions.className =
      "file-actions";


    const openButton =
      document.createElement("button");

    openButton.textContent =
      "OPEN";

    openButton.onclick =
      function() {

        openFile(file.name);

      };


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "delete-btn";

    deleteButton.textContent =
      "DELETE";

    deleteButton.onclick =
      function() {

        deleteFile(file.name);

      };


    actions.appendChild(
      openButton
    );

    actions.appendChild(
      deleteButton
    );


    card.appendChild(name);

    card.appendChild(actions);


    fileList.appendChild(card);

  });

}


/* =================================
   OPEN FILE
   ================================= */


async function openFile(fileName) {

  const filePath =
    currentUser.id +
    "/" +
    fileName;


  /*
    For a private bucket, create
    a temporary signed URL.
  */


  const {
    data,
    error
  } = await supabaseClient.storage
    .from(BUCKET_NAME)
    .createSignedUrl(
      filePath,
      60 * 10
    );


  if (error) {

    showMessage(
      "Unable to open file: " +
      error.message
    );

    return;

  }


  window.open(
    data.signedUrl,
    "_blank"
  );

}


/* =================================
   DELETE FILE
   ================================= */


async function deleteFile(fileName) {

  const confirmed =
    confirm(
      "Delete this file?"
    );


  if (!confirmed) {

    return;

  }


  const filePath =
    currentUser.id +
    "/" +
    fileName;


  const {
    error
  } = await supabaseClient.storage
    .from(BUCKET_NAME)
    .remove([
      filePath
    ]);


  if (error) {

    showMessage(
      "Delete failed: " +
      error.message
    );

    return;

  }


  showMessage(
    "File deleted successfully."
  );


  await loadFiles();

}


/* =================================
   LOGOUT
   ================================= */


async function logout() {

  const {
    error
  } = await supabaseClient.auth.signOut();


  if (error) {

    showMessage(
      "Logout failed: " +
      error.message
    );

    return;

  }


  window.location.href =
    "index.html";

}


/* =================================
   START DASHBOARD
   ================================= */


checkLogin();


</script>


</body>

</html>
